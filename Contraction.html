<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #0f172a; --accent: #2563eb; --success: #059669; --danger: #dc2626; --gold: #fbbf24; --card-bg: #ffffff; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #e2e8f0; margin: 0; padding: 10px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: var(--card-bg); padding: 20px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); box-sizing: border-box; }
    
    .brand-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f1f5f9; }
    .brand-name { font-family: 'Orbitron', sans-serif; font-size: 15px; letter-spacing: 1px; font-weight: 900; background: linear-gradient(45deg, #1e293b, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
    .brand-name i { -webkit-text-fill-color: var(--gold); font-size: 20px; }

    .add-party-btn { background: linear-gradient(135deg, #ecfdf5, #d1fae5); color: #065f46; padding: 10px 14px; border-radius: 15px; cursor: pointer; border: 1.5px solid #059669; font-weight: 800; font-size: 12px; display: flex; align-items: center; gap: 8px; justify-content: center; }
    .icon-stack { position: relative; width: 22px; height: 20px; display: inline-block; }
    .icon-stack .fa-home { font-size: 18px; position: absolute; left: 0; bottom: 0; color: #059669; }
    .icon-stack .fa-tools { font-size: 11px; position: absolute; right: -2px; top: -2px; color: #f59e0b; }

    .date-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .date-box { position: relative; display: flex; align-items: center; }
    .date-box i { position: absolute; left: 12px; color: var(--accent); font-size: 14px; display: flex; align-items: center; justify-content: center; height: 100%; pointer-events: none; }
    .date-box input { width: 100%; padding: 12px 10px 12px 38px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-weight: 700; box-sizing: border-box; outline: none; font-size: 14px; background: #fff; line-height: 1; }

    .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: #fff; padding: 12px 5px; border-radius: 18px; text-align: center; border: 1.5px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .stat-card i { font-size: 16px; margin-bottom: 4px; }
    .stat-label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; display: block; }
    .stat-val { font-size: 14px; font-weight: 800; display: block; margin-top: 3px; }

    .mode-tabs { display: flex; background: #f1f5f9; padding: 5px; border-radius: 15px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; color: #64748b; background: transparent; font-size: 14px; text-align: center; display: flex; align-items: center; justify-content: center; }
    .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }

    .input-grid-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    label { font-size: 11px; font-weight: 800; color: #475569; margin-bottom: 6px; display: block; padding-left: 5px; }
    
    .select-wrapper { position: relative; display: flex; flex-direction: column; }
    .input-container { position: relative; display: flex; align-items: center; width: 100%; }
    .input-container i.main-icon { position: absolute; left: 12px; color: var(--accent); font-size: 14px; pointer-events: none; display: flex; align-items: center; justify-content: center; height: 100%; top: 0; }
    
    select, input[type="number"], input[type="text"] { width: 100%; padding: 12px 10px 12px 38px; border: 2px solid #f1f5f9; border-radius: 15px; font-size: 14px; font-weight: 700; outline: none; box-sizing: border-box; background: #fff; height: 46px; align-items: center; line-height: 1; }

    .type-switcher { display: flex; gap: 10px; margin-bottom: 15px; }
    .t-option { flex: 1; padding: 12px; border-radius: 15px; border: 2px solid #f1f5f9; text-align: center; font-weight: 800; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .t-option.inc.active { border-color: var(--success); color: var(--success); background: #f0fdf4; }
    .t-option.exp.active { border-color: var(--danger); color: var(--danger); background: #fef2f2; }

    .labor-card { background: #f8fafc; padding: 15px; border-radius: 20px; border: 2px dashed #cbd5e1; display: none; margin-bottom: 15px; }
    .wage-display { grid-column: span 2; background: var(--primary); color: #fff; padding: 12px; border-radius: 15px; text-align: center; margin-top: 5px; font-weight: 800; display: flex; align-items: center; justify-content: center; height: 46px; box-sizing: border-box; font-size: 15px; }

    .action-row { display: flex; gap: 12px; margin-top: 20px; }
    .camera-btn { width: 60px; height: 60px; background: #f1f5f9; border-radius: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #e2e8f0; color: #64748b; font-size: 20px; }
    .save-btn { flex: 1; height: 60px; background: linear-gradient(135deg, #1e293b, #334155); color: white; border: none; border-radius: 15px; font-size: 17px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    #successToast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #dcfce7; color: #166534; padding: 15px 25px; border-radius: 20px; border: 2px solid #22c55e; z-index: 5000; box-shadow: 0 10px 25px rgba(0,0,0,0.1); align-items: center; gap: 12px; animation: slideDown 0.5s ease-out; justify-content: center; }
    @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
    .success-icon { width: 30px; height: 30px; background: #22c55e; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    #loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 4000; flex-direction: column; align-items: center; justify-content: center; }
    .spinner { width: 40px; height: 40px; border: 5px solid #f3f3f3; border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #choiceModal, #modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); z-index: 3000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .m-box { background: white; width: 100%; max-width: 380px; padding: 25px; border-radius: 25px; }
    .choice-item { padding: 18px; background: #f8fafc; margin: 12px 0; border-radius: 18px; cursor: pointer; font-weight: 800; border: 2px solid #f1f5f9; display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>

<div id="successToast">
  <div class="success-icon"><i class="fas fa-check"></i></div>
  <div style="font-weight: 800; font-size: 16px;">सफलतापूर्वक सुरक्षित भयो !</div>
</div>

<div id="loader"><div class="spinner"></div><p style="font-weight:800; margin-top:12px;">प्रोसेसिङ हुँदैछ...</p></div>

<div class="container">
  <div class="brand-header">
    <div class="brand-name" id="mainTitle"><i class="fas fa-tools"></i> KHADKA CONSTRUCTION</div>
    <div class="add-party-btn" onclick="openChoice()">
      <span class="icon-stack"><i class="fas fa-home"></i><i class="fas fa-tools"></i></span>
      थप्नुहोस्
    </div>
  </div>

  <div class="date-card">
    <div class="date-box"><i class="fas fa-calendar-alt"></i><input type="text" id="nepDate" placeholder="२०८१/०१/०१" oninput="bsToAd()"></div>
    <div class="date-box"><i class="fas fa-globe" style="color:#8b5cf6"></i><input type="date" id="engDate" onchange="adToBs()"></div>
  </div>

  <div class="dash-grid">
    <div class="stat-card"><i class="fas fa-box-open" style="color:var(--danger)"></i><span class="stat-label">सामान</span><span id="vMat" class="stat-val" style="color:var(--danger)">0</span></div>
    <div class="stat-card"><i class="fas fa-user-clock" style="color:var(--danger)"></i><span class="stat-label">लेबर</span><span id="vLab" class="stat-val" style="color:var(--danger)">0</span></div>
    <div class="stat-card"><i class="fas fa-wallet" style="color:var(--success)"></i><span class="stat-label">बचत</span><span id="vSav" class="stat-val" style="color:var(--success)">0</span></div>
  </div>

  <div class="mode-tabs">
    <button id="bMat" class="tab-btn active" onclick="setMode(false)">सामान</button>
    <button id="bLab" class="tab-btn" onclick="setMode(true)">लेबर</button>
  </div>

  <div class="input-grid-split">
    <div class="select-wrapper">
      <label>आयोजना (ठेक्का)</label>
      <div class="input-container">
        <i class="fas fa-building main-icon" style="color:#f97316"></i>
        <select id="contract" onchange="loadStats()"></select>
      </div>
    </div>
    <div class="select-wrapper" id="itemCol">
      <label>विवरण (सामान)</label>
      <div class="input-container">
        <i class="fas fa-tag main-icon" style="color:#8b5cf6"></i>
        <select id="item"></select>
      </div>
    </div>
    <div class="select-wrapper" id="payCol" style="display:none;">
      <label>आजको भुक्तानी</label>
      <div class="input-container">
        <i class="fas fa-hand-holding-usd main-icon" style="color:#10b981"></i>
        <input type="number" id="lAmt" value="0">
      </div>
    </div>
  </div>

  <div id="matFields">
    <div class="type-switcher">
      <div id="ti" class="t-option inc active" onclick="setType('आम्दानी')">आम्दानी</div>
      <div id="te" class="t-option exp" onclick="setType('खर्च')">खर्च</div>
    </div>
    <div class="input-grid-split">
      <div class="select-wrapper">
        <label>परिमाण</label>
        <div class="input-container">
          <i class="fas fa-layer-group main-icon" style="color:#10b981"></i>
          <input type="number" id="qty" value="0">
        </div>
      </div>
      <div class="select-wrapper">
        <label>कुल रकम</label>
        <div class="input-container">
          <i class="fas fa-coins main-icon" style="color:#f97316"></i>
          <input type="number" id="amt" value="0">
        </div>
      </div>
    </div>
  </div>

  <div id="labFields" class="labor-card">
    <div class="input-grid-split" style="grid-template-columns: 1fr; margin-bottom: 10px;">
      <div class="select-wrapper">
        <label>मिस्त्रीको नाम</label>
        <div class="input-container">
          <i class="fas fa-user main-icon" style="color:#2563eb"></i>
          <input type="text" id="mName" placeholder="मिस्त्रीको नाम लेख्नुहोस्">
        </div>
      </div>
    </div>
    <div class="input-grid-split">
      <div class="select-wrapper">
        <label>मिस्त्री संख्या</label>
        <div class="input-container">
          <i class="fas fa-user-tie main-icon"></i>
          <input type="number" id="mQ" value="0" oninput="calc()">
        </div>
      </div>
      <div class="select-wrapper">
        <label>दर</label>
        <div class="input-container">
          <i class="fas fa-money-bill-wave main-icon"></i>
          <input type="number" id="mR" value="1200" oninput="calc()">
        </div>
      </div>
    </div>
    
    <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 15px 0;">

    <div class="input-grid-split" style="grid-template-columns: 1fr; margin-bottom: 10px;">
      <div class="select-wrapper">
        <label>लेबरको नाम</label>
        <div class="input-container">
          <i class="fas fa-user main-icon" style="color:#059669"></i>
          <input type="text" id="lName" placeholder="लेबरको नाम लेख्नुहोस्">
        </div>
      </div>
    </div>
    <div class="input-grid-split">
      <div class="select-wrapper">
        <label>लेबर संख्या</label>
        <div class="input-container">
          <i class="fas fa-users main-icon"></i>
          <input type="number" id="lQ" value="0" oninput="calc()">
        </div>
      </div>
      <div class="select-wrapper">
        <label>दर</label>
        <div class="input-container">
          <i class="fas fa-money-bill-wave main-icon"></i>
          <input type="number" id="lR" value="800" oninput="calc()">
        </div>
      </div>
      <div class="wage-display">कुल ज्याला: रू. &nbsp;<span id="tW">0</span></div>
    </div>
  </div>

  <div class="select-wrapper">
    <label>कैफियत (टिप्पणी)</label>
    <div class="input-container">
      <i class="fas fa-edit main-icon" style="color:#10b981"></i>
      <input type="text" id="rem" placeholder="...">
    </div>
  </div>

  <div class="action-row">
    <div class="camera-btn" id="camBtn" onclick="document.getElementById('fInp').click()"><i class="fas fa-camera"></i></div>
    <input type="file" id="fInp" hidden accept="image/*" onchange="handleFile(this)">
    <button class="save-btn" onclick="saveData()">सुरक्षित गर्नुहोस्</button>
  </div>
</div>

<div id="choiceModal" onclick="this.style.display='none'">
  <div class="m-box" onclick="event.stopPropagation()">
    <h3 style="text-align:center">सेटिङ</h3>
    <div class="choice-item" onclick="openSet('contract')"><i class="fas fa-building" style="color:var(--accent)"></i> आयोजना थप्नुहोस्</div>
    <div class="choice-item" onclick="openSet('item')"><i class="fas fa-box" style="color:var(--gold)"></i> सामान थप्नुहोस्</div>
    <div class="choice-item" onclick="openSet('company')"><i class="fas fa-id-card" style="color:var(--danger)"></i> कम्पनीको नाम फेर्नुहोस्</div>
  </div>
</div>

<div id="modal">
  <div class="m-box">
    <h3 id="modalTitle">अपडेट</h3>
    <textarea id="mArea" style="width:100%; height:150px; border-radius:15px; border:2px solid #f1f5f9; padding:12px; box-sizing:border-box; outline:none; font-weight:600;"></textarea>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;">
      <button onclick="document.getElementById('modal').style.display='none'" style="padding:12px; border-radius:12px; border:none; background:#f1f5f9; font-weight:700;">रद्द</button>
      <button onclick="saveSet()" style="padding:12px; border-radius:12px; border:none; background:var(--accent); color:white; font-weight:700;">Save</button>
    </div>
  </div>
</div>

<script>
  let isLab = false, curType = 'आम्दानी', settings = {}, base64Img = "";
  const nepaliMonths = [[2081,31,32,31,32,31,30,30,30,29,30,29,31],[2082,31,31,32,31,31,31,30,29,30,29,30,30],[2083,31,31,32,31,31,31,30,29,30,29,30,30]];
  const baseDateEng = new Date("2024-04-13");

  function adToBs() {
    const engInput = document.getElementById('engDate').value;
    if (!engInput) return;
    let totalDays = Math.floor((new Date(engInput) - baseDateEng) / 86400000);
    let cy, cm, cd, f = false;
    for (let y=0; y<nepaliMonths.length; y++) {
      for (let m=1; m<=12; m++) {
        if (totalDays < nepaliMonths[y][m]) { cy = nepaliMonths[y][0]; cm = m; cd = totalDays + 1; f = true; break; }
        totalDays -= nepaliMonths[y][m];
      }
      if (f) break;
    }
    if(f) {
      document.getElementById('nepDate').value = cy + '/' + String(cm).padStart(2,'0') + '/' + String(cd).padStart(2,'0');
    }
    loadStats();
  }

  function bsToAd() {
    const bsVal = document.getElementById('nepDate').value;
    if (bsVal.length < 10) return;
    const p = bsVal.split('/');
    let y = parseInt(p[0]), m = parseInt(p[1]), d = parseInt(p[2]), totalDays = 0;
    for (let i=0; i<nepaliMonths.length; i++) {
      if (nepaliMonths[i][0] === y) {
        for (let j=1; j<m; j++) totalDays += nepaliMonths[i][j];
        totalDays += (d - 1); break;
      }
      for (let j=1; j<=12; j++) totalDays += nepaliMonths[i][j];
    }
    let res = new Date(baseDateEng); res.setDate(res.getDate() + totalDays);
    document.getElementById('engDate').value = res.toISOString().split('T')[0];
    loadStats();
  }

  window.onload = () => { 
    document.getElementById('engDate').valueAsDate = new Date(); 
    adToBs(); 
    google.script.run.withSuccessHandler(d => { settings = d; renderDrop(); loadStats(); }).getInitialData(); 
  };

  function renderDrop() { 
    document.getElementById('contract').innerHTML = settings.contracts.map(c => '<option>'+c+'</option>').join(''); 
    document.getElementById('item').innerHTML = settings.items.map(i => '<option>'+i+'</option>').join(''); 
    // ब्रान्ड हेडरको नाम अपडेट गर्ने
    if(settings.companyName) {
      document.getElementById('mainTitle').innerHTML = '<i class="fas fa-tools"></i> ' + settings.companyName;
    }
    setType(curType);
  }

  function openChoice() { document.getElementById('choiceModal').style.display='flex'; }

  function openSet(t) { 
    document.getElementById('choiceModal').style.display='none';
    window.curSet = t; 
    let title = 'अपडेट';
    if(t === 'contract') title = 'आयोजना थप्नुहोस्';
    else if(t === 'item') title = 'सामान थप्नुहोस्';
    else if(t === 'company') title = 'कम्पनीको नाम फेर्नुहोस्';
    
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modal').style.display='flex'; 
    
    if (t === 'company') {
      document.getElementById('mArea').value = settings.companyName || "KHADKA CONSTRUCTION";
    } else {
      document.getElementById('mArea').value = settings[t+'s'].join(', '); 
    }
  }

  function saveSet() { 
    document.getElementById('loader').style.display = 'flex'; 
    let list = [];
    if(window.curSet === 'company') {
      list = [document.getElementById('mArea').value.trim()];
    } else {
      list = document.getElementById('mArea').value.split(',').map(s=>s.trim()).filter(s=>s!==""); 
    }
    
    google.script.run.withSuccessHandler(() => { 
      google.script.run.withSuccessHandler(d => { 
        settings = d; renderDrop(); 
        document.getElementById('loader').style.display = 'none'; 
        document.getElementById('modal').style.display='none';
      }).getInitialData(); 
    }).updateSettings(window.curSet, list); 
  }

  function setMode(l) { 
    isLab = l; 
    document.getElementById('bLab').classList.toggle('active', l); 
    document.getElementById('bMat').classList.toggle('active', !l);
    document.getElementById('labFields').style.display = l ? 'block' : 'none'; 
    document.getElementById('matFields').style.display = l ? 'none' : 'block'; 
    document.getElementById('itemCol').style.display = l ? 'none' : (curType === 'खर्च' ? 'block' : 'none');
    document.getElementById('payCol').style.display = l ? 'block' : 'none';
    if(l) setType('खर्च');
  }

  function setType(t) { 
    curType = t; 
    document.getElementById('ti').classList.toggle('active', t==='आम्दानी'); 
    document.getElementById('te').classList.toggle('active', t==='खर्च'); 
    if(!isLab) {
      document.getElementById('itemCol').style.display = (t === 'खर्च') ? 'block' : 'none';
    }
  }

  function calc() { 
    const t = (Number(document.getElementById('mQ').value)*Number(document.getElementById('mR').value)) + (Number(document.getElementById('lQ').value)*Number(document.getElementById('lR').value)); 
    document.getElementById('tW').innerText = t.toLocaleString(); 
  }

  function handleFile(input) {
    if(!input.files[0]) return;
    const reader = new FileReader();
    reader.onload = e => { base64Img = e.target.result; document.getElementById('camBtn').style.background = '#059669'; document.getElementById('camBtn').style.color = '#fff'; };
    reader.readAsDataURL(input.files[0]);
  }

  function loadStats() {
    const c = document.getElementById('contract').value; const d = document.getElementById('engDate').value;
    if(!c || !d) return;
    google.script.run.withSuccessHandler(r => {
      document.getElementById('vMat').innerText = r.matExp.toLocaleString(); 
      document.getElementById('vLab').innerText = r.labExp.toLocaleString(); 
      document.getElementById('vSav').innerText = r.savings.toLocaleString();
    }).getContractSummary(c, d);
  }

  function showSuccess() {
    const toast = document.getElementById('successToast');
    toast.style.display = 'flex';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);
  }

  function saveData() {
    document.getElementById('loader').style.display = 'flex';
    const d = { 
      isLabor: isLab, englishDate: document.getElementById('engDate').value, 
      nepaliDate: document.getElementById('nepDate').value, contract: document.getElementById('contract').value, 
      type: isLab ? 'खर्च' : curType, remarks: document.getElementById('rem').value, 
      amt: Number(isLab ? document.getElementById('lAmt').value : document.getElementById('amt').value), 
      item: isLab ? "लेबर भुक्तानी" : document.getElementById('item').value, 
      qty: isLab ? 1 : document.getElementById('qty').value, 
      mistryName: document.getElementById('mName').value, 
      mistryQty: document.getElementById('mQ').value, mistryRate: document.getElementById('mR').value, 
      laborName: document.getElementById('lName').value,   
      laborQty: document.getElementById('lQ').value, laborRate: document.getElementById('lR').value, 
      imageFile: base64Img 
    };
    google.script.run.withSuccessHandler(res => { 
      document.getElementById('loader').style.display = 'none';
      if(res === "OK") { 
        showSuccess(); 
        resetForm(); 
        loadStats(); 
      } else { alert(res); }
    }).saveEntry(d);
  }

  function resetForm() { 
    document.getElementById('amt').value = 0; document.getElementById('lAmt').value = 0; 
    document.getElementById('qty').value = 0; document.getElementById('mQ').value = 0; 
    document.getElementById('lQ').value = 0; document.getElementById('rem').value = ""; 
    document.getElementById('mName').value = ""; document.getElementById('lName').value = ""; 
    document.getElementById('tW').innerText = 0; document.getElementById('fInp').value = ""; 
    document.getElementById('camBtn').style.background = '#f1f5f9'; base64Img = ""; 
  }
