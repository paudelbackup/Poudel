
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>बर पिपल कृषि सहकारी संस्था</title> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* CSS Code */
    :root { 
        --primary: #007bff; 
        --bg: #f5f8ff; 
        --card: #fff; 
        --text: #333; 
        --border: #e0e0e0; 
        --radius: 14px; 
        --highlight: #f0f8ff; 
        --success: #28a745; 
        --danger: #dc3545;
        --secondary-text: #6c757d;
        --warning: #ffc107;
    }

    /* Global/Mobile Reset */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
    }

    #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .page-title { text-align: center; font-size: 24px; font-weight: 700; color: var(--primary); padding: 16px 20px 8px; flex-shrink: 0; }

    .header { 
        background: var(--card); padding: 12px 16px; display: grid; /* Grid प्रयोग गरियो */
        grid-template-columns: 1fr; /* पूर्वनिर्धारित */
        gap: 12px; 
        border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
        position: sticky; top: 0; z-index: 10; flex-shrink: 0;
    }
    
    /* ५०/५० ग्रिडको लागि */
    .header.grid-50-50 {
        grid-template-columns: 1fr 1fr; 
    }

    .select-box { flex: 1; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; 
        font-size: 15px; background: #fafafa; display: flex; align-items: center; gap: 10px; 
        color: #444; cursor: pointer; transition: all 0.2s; 
        width: 100%;
    }
    .select-box i { color: var(--primary); font-size: 18px; }

    .date-picker { position: relative; }
    .date-picker input[type="date"] { opacity: 0; position: absolute; width: 100%; height: 100%; cursor: pointer; }
    .date-display { padding: 0; background: transparent; border: none; font-size: 15px; 
        display: flex; align-items: center; gap: 10px; font-weight: 500; }

    .form-body { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 120px; -webkit-overflow-scrolling: touch; position: relative; } 

    /* Input Styling */
    .input-group { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 16px; }
    /* ५०/५० रो लेआउटको लागि नयाँ वर्ग */
    .input-group.grid-50-50 {
        grid-template-columns: 1fr 1fr; 
    }
    .input-wrapper { position: relative; }
    .input-field { width: 100%; padding: 16px 16px 16px 48px; border: 1.5px solid var(--border); 
        border-radius: var(--radius); font-size: 15.5px; background: #fafafa; transition: all 0.25s; }
    /* Header भित्र ग्राहक नामको लागि प्याडिङ मिलाउने */
    .header .input-field {
        padding: 12px 14px 12px 48px; 
        height: 100%; 
        min-height: 44px;
    }
    
    .input-field:focus { outline: none; border-color: var(--primary); background: white; 
        box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.18); }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); 
        color: var(--primary); font-size: 19px; pointer-events: none; }

    /* Highlighted Fields */
    .highlighted .input-field { background: var(--highlight); font-weight: 500; border-color: var(--primary); }
    .highlighted.deposit .input-icon { color: var(--success); }
    .highlighted.deduct .input-icon { color: var(--danger); }

/* --- Calculation Display Cards --- */
    .calculation-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; margin-bottom: 16px; }
    .calc-card {
        background: var(--card); border-radius: 12px; padding: 14px; text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08); border-top: 3px solid;
    }
    .card-total { border-color: var(--success); }
    .card-debt { border-color: var(--danger); }
    
    .calc-card .label {
        font-size: 12px;
        color: var(--secondary-text); 
        font-weight: 500; 
        margin-bottom: 4px;
        display: block;
    }
    .calc-card .label span {
        font-weight: 700;
        color: var(--text);
        margin-left: 2px;
    }
    
    .calc-card .value { 
        font-size: 19px; 
        font-weight: 700; 
        color: var(--text); 
        display: block; 
    }
    .calc-card .value small { font-size: 13px; font-weight: 500; color: var(--secondary-text); }
    
    /* --- Interest Toggler (Small Radio Buttons) --- */
    .interest-toggle-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
        padding-left: 5px;
    }
    .interest-toggle-group label {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
    }
    /* Small custom radio button */
    .interest-toggle-group input[type="radio"] {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--primary);
        border-radius: 50%;
        margin-right: 8px;
        position: relative;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
        flex-shrink: 0;
    }
    .interest-toggle-group input[type="radio"]:checked {
        background-color: var(--primary);
        border-color: var(--primary);
    }
    .interest-toggle-group input[type="radio"]:checked::before {
        content: '';
        display: block;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Period Selector */
    .period-group { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .period-group select {
        padding: 16px 16px 16px 48px; 
        border: 1.5px solid var(--border); 
        border-radius: var(--radius); 
        font-size: 15.5px; 
        background: #fafafa;
        appearance: none;
        cursor: pointer;
    }

    /* --- Submit Button --- */
    .submit-btn { 
        width: calc(100% - 32px); margin: 20px 16px 16px; padding: 18px; 
        background: linear-gradient(135deg, var(--primary), #0056b3); color: white; border: none; 
        border-radius: var(--radius); font-size: 17px; font-weight: 600; cursor: pointer; 
        transition: all 0.3s; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3); 
        position: sticky; bottom: 16px; z-index: 5;
    }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* --- Loading State Fix --- */
    .loading { 
      display: none; 
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0; 
      align-items: center; justify-content: center; 
      flex-direction: column; 
      z-index: 100;
      background: rgba(255, 255, 255, 0.9); 
      color: var(--primary); 
      font-weight: 600; 
      gap: 15px; 
      border-radius: 14px;
    }

    .loader { width: 50px; height: 50px; border: 6px solid #f3f3f3; border-top: 6px solid var(--primary); 
        border-radius: 50%; animation: spin 1.2s linear infinite; }
    
    /* Success Check (Global Overlay) */
    .success-check { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;

align-items: center; justify-content: center; flex-direction: column; z-index: 2000; 
        background: rgba(0,0,0,0.9); }
    .success-check-content { background: white; padding: 60px 80px; border-radius: 25px; 
        box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; color: var(--text); }
    .success-check i { font-size: 120px; color: var(--success); animation: bounce 0.6s; margin-bottom: 20px; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

/* Scrollbar Hide */
    * { -ms-overflow-style: none; scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <div id="app">
    <div class="page-title">बर पिपल कृषि सहकारी संस्था</div>

    <div class="header grid-50-50">
      <div class="select-box date-picker">
        <i class="fas fa-calendar-alt"></i>
        <div class="date-display" id="dateDisplay">मिति चयन गर्नुहोस्</div>
        <input type="date" id="dateInput" />
      </div>
      
      <div class="input-wrapper highlighted" style="margin: 0;">
        <i class="fas fa-user input-icon"></i>
        <input type="text" class="input-field" placeholder="ग्राहकको नाम" id="customerName">
      </div>
    </div>
    <div class="form-body">
      
      <div class="loading" id="loading">
        <div class="loader"></div>
        <div>डाटा प्रशोधन हुँदैछ...</div>
      </div>
      
      <div class="calculation-summary" id="prevRecordSummary">
        <div class="calc-card card-total">
          <div class="label">अघिल्लो कुल जम्मा: <span id="prevDepositLabel">0.00</span> रु.</div>
          <div class="value" id="currentTotalDepositDisplay">0.00 <small>नयाँ कुल जम्मा</small></div>
        </div>
        <div class="calc-card card-debt">
          <div class="label">अघिल्लो बाँकी ऋण: <span id="prevRemainingDebtLabel">0.00</span> रु.</div>
          <div class="value" id="currentRemainingDebtDisplay">0.00 <small>बाँकी ऋण</small></div>
        </div>
      </div>
      
      <div class="input-group grid-50-50">
          
          <div class="input-wrapper highlighted deposit">
            <i class="fas fa-plus-circle input-icon"></i>
            <input type="number" class="input-field" placeholder="आजको बचत/जम्मा रकम (रु.)" min="0" step="1" id="todayDeposit">
          </div>
          
          <div class="input-wrapper highlighted deduct">
            <i class="fas fa-minus-circle input-icon"></i>
            <input type="number" class="input-field" placeholder="ऋणमा काटिने रकम (रु.)" min="0" step="1" id="todayDeduct">
          </div>
      </div>
      
      <div class="input-group">
        <div class="input-wrapper highlighted deduct">
          <i class="fas fa-hand-holding-dollar input-icon"></i>
          <input type="number" class="input-field" placeholder="आज लिएको नयाँ ऋण रकम (रु.)" min="0" step="1" id="newLoanAmount">
        </div>
      </div>

      <div class="interest-toggle-group">
        <label>
            <input type="radio" id="toggleInterestOn" name="interestToggle" value="on">
            ब्याज गणना प्रयोग गर्ने
        </label>
        <label>
            <input type="radio" id="toggleInterestOff" name="interestToggle" value="off" checked>
            ब्याज गणना प्रयोग नगर्ने
        </label>
      </div>

      <div class="interest-section" id="interestSection" style="display:none;">
          <div class="input-group grid-50-50"> 
              <div class="input-wrapper highlighted deposit">
                  <i class="fas fa-coins input-icon"></i>
                  <input type="number" class="input-field" placeholder="ब्याज लाग्ने रकम (रु.)" min="0" step="1" id="interestAmount">
              </div>

<div class="input-wrapper highlighted deduct">
                  <i class="fas fa-percent input-icon"></i>
                  <input type="number" class="input-field" placeholder="ब्याज प्रतिशत (%)" min="0" max="100" step="0.1" id="interestRate">
              </div>
          </div>
          
          <div class="input-group period-group">
              <div class="input-wrapper" style="position: relative;">
                  <i class="fas fa-hourglass-half input-icon"></i>
                  <input type="number" class="input-field" placeholder="अवधि संख्या" min="1" step="1" id="interestPeriodValue">
              </div>
              <div class="input-wrapper" style="position: relative;">
                  <i class="fas fa-calendar-check input-icon"></i>
                  <select class="input-field" id="interestPeriodUnit">
                      <option value="year">वर्ष (Year)</option>
                      <option value="month">महिना (Month)</option>
                      <option value="day">दिन (Day)</option>
                  </select>
              </div>
          </div>

          <div class="calc-card" style="border-top: 3px solid var(--warning); margin-bottom: 16px;">
              <div class="label">कुल ब्याज रकम:</div>
              <div class="value" id="calculatedInterestDisplay">0.00 <small>रु.</small></div>
          </div>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <i class="fas fa-sticky-note input-icon"></i>
          <input type="text" class="input-field" placeholder="विवरण / नोट्स" id="details">
        </div>
      </div>
      
      <div style="display:none;">
          <input type="text" id="newTotalDeposit" data-prev-deposit="0.00" value="0.00">
          <input type="text" id="totalLoan" data-prev-total-loan="0.00" value="0.00"> 
          <input type="text" id="remainingDebt" data-prev-remaining-debt="0.00" value="0.00"> 
          <input type="text" id="calculatedInterestInput" value="0.00"> 
          <input type="text" id="newLoanAmount" value="0.00"> </div>
      
    </div>
    <button class="submit-btn" id="submitBtn">रेकर्ड सुरक्षित गर्नुहोस्</button>
  </div>
  
  <div class="success-check" id="successCheck">
    <div class="success-check-content">
      <i class="fas fa-check-circle"></i>
      <div style="font-size:24px; font-weight:700; margin-top: 10px;">सफल भयो!</div>
      <div style="font-size:16px; color:#666; margin-top:5px;">ऋण रेकर्ड सफलतापूर्वक सुरक्षित गरियो।</div>
    </div>
  </div>

<script>
    // Variables
    const dateInput = document.getElementById('dateInput');
    const dateDisplay = document.getElementById('dateDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const successCheck = document.getElementById('successCheck');
    const customerName = document.getElementById('customerName');

    // Display Cards
    const currentTotalDepositDisplay = document.getElementById('currentTotalDepositDisplay');
    const currentRemainingDebtDisplay = document.getElementById('currentRemainingDebtDisplay');
    const prevDepositLabel = document.getElementById('prevDepositLabel');
    const prevRemainingDebtLabel = document.getElementById('prevRemainingDebtLabel'); 

    // Hidden Calculation Fields
    const newTotalDeposit = document.getElementById('newTotalDeposit');
    const totalLoan = document.getElementById('totalLoan'); 
    const remainingDebt = document.getElementById('remainingDebt'); 
    const calculatedInterestInput = document.getElementById('calculatedInterestInput'); 

    // Visible Input Fields
    const todayDeposit = document.getElementById('todayDeposit');
    const newLoanAmount = document.getElementById('newLoanAmount'); 
    const todayDeduct = document.getElementById('todayDeduct');
    const details = document.getElementById('details');

// Interest Calculation Variables
    const toggleInterestOn = document.getElementById('toggleInterestOn');
    const toggleInterestOff = document.getElementById('toggleInterestOff');
    const interestSection = document.getElementById('interestSection');
    const interestAmount = document.getElementById('interestAmount');
    const interestRate = document.getElementById('interestRate'); 
    const interestPeriodValue = document.getElementById('interestPeriodValue');
    const interestPeriodUnit = document.getElementById('interestPeriodUnit');
    const calculatedInterestDisplay = document.getElementById('calculatedInterestDisplay');
    
    let isFetchingDebt = false; 
    let debtFetchTimeout; 

    function formatCurrency(value) {
        return (parseFloat(value) || 0).toFixed(2);
    }

    function formatDate(dateString) {
      if (!dateString) return 'मिति चयन गर्नुहोस्';
      const d = new Date(dateString);
      const day = String(d.getDate()).padStart(2,'0');
      const month = String(d.getMonth()+1).padStart(2,'0');
      const year = d.getFullYear();
      return ${day}/${month}/${year};
    }

    // ⭐ Calculation Logic - Updated ⭐
    function calculateDebt() {
        // Hidden Inputs बाट अघिल्लो संचयी मानहरू लिने
        const prevTotalDeposit = parseFloat(newTotalDeposit.dataset.prevDeposit || 0); 
        const prevTotalLoan = parseFloat(totalLoan.dataset.prevTotalLoan || 0); 
        const prevRemainingDebt = parseFloat(remainingDebt.dataset.prevRemainingDebt || 0); 
        
        // यदि इनपुट खाली छ भने, '0' मान्ने
        const deposit = parseFloat(todayDeposit.value || 0);
        const newLoan = parseFloat(newLoanAmount.value || 0);
        const deduct = parseFloat(todayDeduct.value || 0); 
        const calculatedInt = parseFloat(calculatedInterestInput.value) || 0; 

        // १. नयाँ कुल जम्मा (संचयी) = (अघिल्लो कुल जम्मा) + (आजको जम्मा)
        const newTotal = prevTotalDeposit + deposit; 
        newTotalDeposit.value = newTotal.toFixed(2);

        // २. बाँकी ऋण (संचयी) = max(0, (अघिल्लो बाँकी ऋण) + (आजको नयाँ ऋण) + (गणना गरिएको ब्याज) - (ऋणमा काटिने रकम))
        // ⚠️ ब्याजलाई बाँकी ऋणमा जोडियो 
        let newRemainingDebt = prevRemainingDebt + newLoan + calculatedInt - deduct; 
        const finalRemaining = newRemainingDebt > 0 ? newRemainingDebt : 0.00;
        remainingDebt.value = finalRemaining.toFixed(2); 

        // ३. कुल लिएको ऋण (संचयी) = (अघिल्लो कुल लिएको ऋण) + (आजको नयाँ ऋण) + (गणना गरिएको ब्याज)
        // ⚠️ ब्याजलाई कुल लिएको ऋणमा जोडियो
        const finalTotalLoan = prevTotalLoan + newLoan + calculatedInt; 
        totalLoan.value = finalTotalLoan.toFixed(2);
        
        // Display Card मा नयाँ मान अपडेट गर्ने
        currentTotalDepositDisplay.textContent = formatCurrency(newTotal);
        currentRemainingDebtDisplay.textContent = formatCurrency(finalRemaining);
    }
    
    // Interest Calculation Function with Time Period
    function calculateInterest() {
        if (!toggleInterestOn.checked) {
             calculatedInterestDisplay.textContent = '0.00';
             calculatedInterestInput.value = '0.00'; 
             calculateDebt(); 
             return; 
        }

        const P = parseFloat(interestAmount.value || 0); 
        const R = parseFloat(interestRate.value || 0);   
        const T_value = parseFloat(interestPeriodValue.value || 0); 
        const T_unit = interestPeriodUnit.value; 

        let T_years; 
        
        if (T_unit === 'month') {
            T_years = T_value / 12; 
        } else if (T_unit === 'day') {
            T_years = T_value / 365; 
        } else { // 'year'
            T_years = T_value;
        }

        // साधारण ब्याज गणना: I = (P * R * T) / 100
        const calculatedInterest = (P * R * T_years) / 100;
        
        calculatedInterestDisplay.textContent = formatCurrency(calculatedInterest);
        calculatedInterestInput.value = calculatedInterest.toFixed(2); 

        calculateDebt(); 
    }

// Previous Data Fetching Logic (पहिलाको जस्तै)
    function getPreviousDebt() {
      if (isFetchingDebt) return; 
      
      const customer = customerName.value.trim();
      const date = dateInput.value;

      if (!customer || !date) {
        resetCalculationVariables();
        loading.style.display = 'none';
        return;
      }
      
      isFetchingDebt = true; 
      loading.style.display = 'flex'; 
      
      google.script.run
        .withSuccessHandler(data => {
          loading.style.display = 'none';
          isFetchingDebt = false; 
          
          const pDep = formatCurrency(data.previousNewTotalDeposit);
          const pTotalLoan = formatCurrency(data.previousTotalLoan);
          const pRemDebt = formatCurrency(data.previousRemainingDebt);

          // Data Attribute मा संचयी मानहरू सेट गर्ने
          newTotalDeposit.dataset.prevDeposit = pDep; 
          totalLoan.dataset.prevTotalLoan = pTotalLoan; 
          remainingDebt.dataset.prevRemainingDebt = pRemDebt;
          
          // Card Label मा अघिल्लो रेकर्डको संचयी मान सेट गर्ने
          prevDepositLabel.textContent = pDep;
          prevRemainingDebtLabel.textContent = pRemDebt;
          
          calculateDebt(); 
        })
        .withFailureHandler(err => {
          loading.style.display = 'none';
          isFetchingDebt = false; 
          alert('अघिल्लो रेकर्ड तान्न त्रुटि: ' + err.message);
          resetCalculationVariables();
          calculateDebt();
        })
        .getCustomerPreviousRecord(customer, date); 
    }

    // Calculation variables लाई 0.00 मा सेट गर्ने
    function resetCalculationVariables() {
        newTotalDeposit.dataset.prevDeposit = '0.00'; 
        totalLoan.dataset.prevTotalLoan = '0.00';
        remainingDebt.dataset.prevRemainingDebt = '0.00';
        
        prevDepositLabel.textContent = '0.00';
        prevRemainingDebtLabel.textContent = '0.00';
    }

    // --- Event Listeners ---
    document.querySelector('.date-picker').addEventListener('click', () => {
      try { dateInput.showPicker(); } catch (e) {}
    });

    dateInput.addEventListener('change', () => {
      dateDisplay.textContent = formatDate(dateInput.value);
      getPreviousDebt(); 
    });

    // Debounce Logic: 500ms पछि Fetch गर्ने
    customerName.addEventListener('input', () => {
        resetCalculationVariables();
        calculateDebt();

        clearTimeout(debtFetchTimeout);
        
        debtFetchTimeout = setTimeout(() => {
            getPreviousDebt();
        }, 500); 
    });
    
    // blur मा सीधा Fetch गर्ने
    customerName.addEventListener('blur', () => {
        clearTimeout(debtFetchTimeout); 
        getPreviousDebt();
    });

    // आजको जम्मा, नयाँ ऋण, र ऋणमा काटिने रकममा परिवर्तन हुँदा गणना गर्ने
    [todayDeposit, newLoanAmount, todayDeduct].forEach(input => {
      input.addEventListener('input', calculateDebt);
    });

    // Interest Toggler Logic
    toggleInterestOn.addEventListener('change', () => {
        interestSection.style.display = 'block';
        calculateInterest(); 
    });
    
    toggleInterestOff.addEventListener('change', () => {
        interestSection.style.display = 'none';
        // मानहरू खाली गर्ने
        interestAmount.value = '';
        interestRate.value = '';
        interestPeriodValue.value = '';
        calculatedInterestDisplay.textContent = '0.00';
        calculatedInterestInput.value = '0.00'; // Hidden input लाई पनि 0 गर्ने
        calculateDebt(); // ऋण गणनालाई अपडेट गर्ने
    });

    // ब्याज इनपुट परिवर्तन हुँदा गणना गर्ने
    [interestAmount, interestRate, interestPeriodValue, interestPeriodUnit].forEach(input => {
      input.addEventListener('input', calculateInterest);
      input.addEventListener('change', calculateInterest);
    });

    submitBtn.addEventListener('click', () => {
      if (!dateInput.value) { alert('मिति चयन गर्नुहोस्।'); return; }
      if (!customerName.value.trim()) { alert('ग्राहकको नाम लेख्नुहोस्।'); return; }

// सुनिश्चित गर्नको लागि दुई पटक गणना गर्ने
      calculateInterest(); 
      calculateDebt(); 
      
      submitBtn.disabled = true;
      loading.style.display = 'flex';
      submitData();
    });

    function submitData() {
      // ब्याज डाटा
      const interestOn = toggleInterestOn.checked;
      const interestAmt = interestOn ? (parseFloat(interestAmount.value || 0)) : 0.00;
      const calculatedInt = parseFloat(calculatedInterestInput.value) || 0;
      const interestRateVal = interestOn ? (parseFloat(interestRate.value || 0)) : 0.00; 

      // कुल ऋण मानहरू Hidden Input बाट लिने
      const finalNewTotalDeposit = parseFloat(newTotalDeposit.value) || 0;
      const finalTotalLoan = parseFloat(totalLoan.value) || 0; 
      const finalRemainingDebt = parseFloat(remainingDebt.value) || 0; 


      const data = {
        date: dateInput.value,
        customerName: customerName.value.trim(),
        todayDeposit: parseFloat(todayDeposit.value || 0),
        todayDeduct: parseFloat(todayDeduct.value || 0),
        
        // नयाँ ऋणको रकम यहाँ थपिएको
        newLoanAmount: parseFloat(newLoanAmount.value || 0),

        newTotalDeposit: finalNewTotalDeposit, 
        totalLoan: finalTotalLoan, 
        remainingDebt: finalRemainingDebt, 
        
        interestAmount: interestAmt, 
        calculatedInterest: calculatedInt,
        interestRate: interestRateVal, 
        
        details: details.value.trim()
      };

      google.script.run
        .withSuccessHandler(result => {
          loading.style.display = 'none';
          if (result && result.status === 'success') {
            successCheck.style.display = 'flex';
            resetForm();
            setTimeout(() => {
              successCheck.style.display = 'none';
              submitBtn.disabled = false;
            }, 1800);
          } else {
            alert('त्रुटि: ' + (result?.message || 'डाटा बचत भएन।'));
            submitBtn.disabled = false;
          }
        })
        .withFailureHandler(err => {
          loading.style.display = 'none';
          alert('सञ्जाल त्रुटि: ' + err.message);
          submitBtn.disabled = false;
        })
        .processDebtForm(data);
    }

    function resetForm() {
      ['customerName', 'details'].forEach(id => {
        document.getElementById(id).value = '';
      });
      // इनपुट फिल्ड खाली राख्ने
      todayDeposit.value = '';
      newLoanAmount.value = ''; 
      todayDeduct.value = '';

      resetCalculationVariables();
      
      // ब्याज फिल्डहरू पनि रिसेट गर्ने र toggle off गर्ने
      interestAmount.value = '';
      interestRate.value = '';
      interestPeriodValue.value = '';
      interestPeriodUnit.value = 'year'; 
      calculatedInterestDisplay.textContent = '0.00';
      calculatedInterestInput.value = '0.00';
      
      toggleInterestOff.checked = true;
      interestSection.style.display = 'none';
      
      const today = new Date().toISOString().split('T')[0];
      dateInput.value = today;
      dateDisplay.textContent = formatDate(today);
      
      calculateDebt(); 
    }

    window.onload = () => {
      resetForm();
    };
  </script>
</body>
</html>
