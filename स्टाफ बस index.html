<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Mukta:wght@600;800&display=swap');
    :root { 
      --bg: #0f172a; 
      --card: #1e293b; 
      --blue: #38bdf8; 
      --green: #4ade80; 
      --red: #fb7185; 
      --orange: #fb923c; 
      --text: #f1f5f9; 
      --border: #334155; 
      /* नयाँ रङ्गीचङ्गी आइकन थिम कलरहरू */
      --ic-bus: #38bdf8;      /* स्काई ब्लू */
      --ic-driver: #a855f7;   /* पर्पल */
      --ic-inst: #f43f5e;     /* पिन्क/रेड */
      --ic-trip: #eab308;     /* पहेलो */
      --ic-date: #10b981;     /* हरियो */
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta', sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
    
    /* हेडरका सबै सामाग्रीहरू नछोपिने गरी मिलाइएको */
    .header { 
      padding: 8px 10px; background: var(--card); border-bottom: 2px solid var(--blue); 
      display: flex; flex-direction: row; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 6px; position: sticky; top: 0; z-index: 1000;
    }
    /* नेपाली मितिको साइज अलिक बढाएर १३ पिक्सेल बनाइएको */
    #bsDisplay { font-size: 13px; font-weight: 800; color: var(--green); white-space: nowrap; flex: 2.2; text-align: left; overflow: hidden; text-overflow: ellipsis; }
    .header-right { display: flex; gap: 5px; flex: 3.8; justify-content: flex-end; align-items: center; min-width: 0; }
    
    .head-sel { background: #0f172a; color: white; border: 1px solid var(--blue); border-radius: 5px; padding: 2px; font-size: 11px; font-weight: 800; outline: none; height: 30px; flex: 1; min-width: 0; }
    
    /* एडी क्यालेन्डर आइकन कन्टेनर र हिडन इनपुट */
    .date-wrapper { position: relative; display: flex; align-items: center; justify-content: center; background: #0f172a; border: 1px solid var(--red); border-radius: 5px; height: 30px; width: 42px; cursor: pointer; flex: 0 0 42px; }
    .date-wrapper i { color: var(--red); font-size: 16px; pointer-events: none; }
    .head-date-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

    .container { padding: 12px; max-width: 600px; margin: auto; }
    
    /* रङ्गीचङ्गी आइकन र बोर्डर डिजाइन */
    .setting-bar { display: flex; gap: 5px; margin-bottom: 12px; }
    .set-btn { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 8px 2px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .set-btn:active { transform: scale(0.95); background: #1e293b; }
    .set-btn i { font-size: 18px; display: block; margin-bottom: 2px; }
    
    /* प्रत्येक बटनलाई छुट्टाछुट्टै चम्किलो कलर र इफेक्ट */
    .set-btn.sb-bus i { color: var(--ic-bus); text-shadow: 0 0 8px rgba(56,189,248,0.3); }
    .set-btn.sb-driver i { color: var(--ic-driver); text-shadow: 0 0 8px rgba(168,85,247,0.3); }
    .set-btn.sb-inst i { color: var(--ic-inst); text-shadow: 0 0 8px rgba(244,63,94,0.3); }
    .set-btn.sb-trip i { color: var(--ic-trip); text-shadow: 0 0 8px rgba(234,179,8,0.3); }
    .set-btn.sb-date i { color: var(--ic-date); text-shadow: 0 0 8px rgba(16,185,129,0.3); }
    .set-btn span { font-size: 10px; font-weight: 800; color: #cbd5e1; text-transform: uppercase; }

    .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--blue); background: rgba(56,189,248,0.1); color: var(--blue); font-weight: 800; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--blue); color: #000; box-shadow: 0 0 10px rgba(56,189,248,0.4); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--blue); }
    .label { font-size: 10px; color: var(--blue); font-weight: 800; margin-bottom: 4px; text-transform: uppercase; text-align: left; }
    
    input, select, .km-box { 
      width: 100%; height: 40px; border-radius: 8px; background: #0f172a; border: 1px solid var(--border); color: white; 
      font-size: 14px; font-weight: 700; outline: none; padding: 0 4px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    
    .km-box { border: 2px solid var(--green); color: var(--green); font-family: 'Orbitron'; display: flex; align-items: center; justify-content: center; }
    
    .row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 6px; margin-bottom: 10px; width: 100%; overflow: hidden; }
    .col { flex: 1; min-width: 0; }

    /* नयाँ क्यामेरा आइकन डिजाइन - पर्फेक्ट गोलो सर्कल र सेन्टर एलाइनमेन्ट */
    .photo-container { display: flex; justify-content: center; align-items: center; width: 100%; height: 40px; }
    #photoBtn { 
      width: 42px; 
      height: 42px; 
      background: rgba(234, 179, 8, 0.15); 
      border: 2px dashed var(--ic-trip); 
      color: var(--ic-trip); 
      border-radius: 50%; /* १००% गोलो सर्कल */
      cursor: pointer; 
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      position: relative;
      box-shadow: 0 0 8px rgba(234,179,8,0.2);
      transition: 0.2s;
    }
    #photoBtn:active { transform: scale(0.9); }
    #photoBtn i { font-size: 16px; margin: 0; padding: 0; display: block; }
    #photoBtn img { width: 100%; height: 100%; object-fit: cover; position: absolute; border-radius: 50%; }

    .btn-save { background: linear-gradient(135deg, var(--blue), var(--green)); border: none; padding: 16px; border-radius: 15px; color: #000; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center; }
    .modal-content { background:var(--card); padding:20px; border-radius:15px; border:2px solid var(--blue); width:90%; max-width:320px; text-align: center; }
    .m-list { max-height: 200px; overflow-y: auto; margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; }
    .m-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); color: white; font-weight: 600; }
    
    .date-pop-card { background: var(--bg); border: 1px solid var(--blue); border-radius: 10px; padding: 15px; margin-top: 10px; }
    
    /* प्लस माइनस बटन क्लिक गर्दा एक्टिभ संकेत */
    .btn-date-adj:active { background: #fff !important; color: #000 !important; transform: scale(0.95); transition: 0.1s; }
  </style>
</head>
<body>

<div class="header">
  <div id="bsDisplay">लोड हुँदैछ...</div>
  
  <div class="header-right">
    <div class="date-wrapper">
      <i class="fas fa-calendar-alt"></i>
      <input type="date" id="adPicker" class="head-date-input" onchange="pickADDate(this.value)">
    </div>
    
    <select id="tripSelectHeader" class="head-sel"><option value="">ट्रिप</option></select>
    
    <select id="shiftSelect" class="head-sel">
      <option value="बिहान">बिहान</option>
      <option value="दिउँसो">दिउँसो</option>
      <option value="दुवै" selected>दुवै</option>
      <option value="विदा">विदा</option>
    </select>
  </div>
</div>

<div class="container">
  <div class="setting-bar">
    <div class="set-btn sb-bus" onclick="openMgr('busNumber', 'बस नम्बर सेटिङ')"><i class="fas fa-bus"></i><span>बस</span></div>
    <div class="set-btn sb-driver" onclick="openMgr('driverName', 'ड्राइभर सेटिङ')"><i class="fas fa-user-tie"></i><span>ड्राइभर</span></div>
    <div class="set-btn sb-inst" onclick="openMgr('instName', 'संस्था सेटिङ')"><i class="fas fa-university"></i><span>संस्था</span></div>
    <div class="set-btn sb-trip" onclick="openMgr('tripList', 'ट्रिप सेटिङ')"><i class="fas fa-route"></i><span>ट्रिप</span></div>
    <div class="set-btn sb-date" onclick="openDateModal()"><i class="fas fa-calendar-alt"></i><span>गते +/-</span></div>
  </div>

  <div class="tab-row">
    <div id="tInst" class="tab-btn active" onclick="switchSection('Institution')">नियमित संस्था</div>
    <div id="tRes" class="tab-btn" onclick="switchSection('Reserve')">रिजर्भ सेक्सन</div>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="row">
        <div class="col"><div class="label">बस नम्बर</div><select id="busNumber" onchange="fetchOldKM()"></select></div>
        <div class="col" id="instCol"><div class="label">संस्था</div><select id="instName"></select></div>
        <div class="col"><div class="label">ड्राइभर</div><select id="driverName"></select></div>
      </div>

      <div id="resFields" style="display:none; border-top: 1px solid #334155; padding-top: 10px; margin-top: 5px;">
        <div class="row"><div class="col"><div class="label">कहाँबाट</div><input type="text" id="fromLoc"></div><div class="col"><div class="label">कहाँसम्म</div><input type="text" id="toLoc"></div></div>
        <div class="row"><div class="col"><div class="label">भाडा</div><input type="number" id="resAmt" oninput="reCalc()"></div><div class="col"><div class="label">खर्च</div><input type="number" id="resExp" oninput="reCalc()"></div><div class="col"><div class="label">बचत</div><div id="resSav" class="km-box" style="color:var(--orange);">०</div></div></div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col"><div class="label">स्टार्ट KM</div><div id="oKM" class="km-box">०</div></div>
        <div class="col"><div class="label">आजको KM</div><input type="number" id="cKM" oninput="upKM()"></div>
        <div class="col"><div class="label">चलेको</div><div id="rKM" class="km-box" style="color:var(--blue);">०</div></div>
      </div>
    </div>

    <div class="card" style="border-left-color: var(--green);">
      <div class="row">
        <div class="col"><div class="label">लिटर</div><input type="number" step="any" id="dLit" oninput="dfc('lit')"></div>
        <div class="col"><div class="label">रेट</div><input type="number" step="any" id="dRat" oninput="dfc('rat')"></div>
        <div class="col"><div class="label">डिजेल रकम</div><input type="number" step="any" id="dAmt" oninput="dfc('amt')"></div>
      </div>
      <div class="row" style="align-items: flex-end;">
        <div class="col" style="flex:3"><div class="label">कैफियत</div><input type="text" id="rem"></div>
        <div class="col">
          <div class="label" style="text-align: center;">फोटो</div>
          <div class="photo-container">
            <div id="photoBtn" onclick="document.getElementById('pFile').click()"><i class="fas fa-camera"></i></div>
          </div>
          <input type="file" id="pFile" accept="image/*" style="display:none" onchange="pv(this)">
        </div>
      </div>
    </div>
    <button type="button" class="btn-save" onclick="saveFormRecord()">डाटा सुरक्षित गर्नुहोस्</button>
  </form>
</div>

<div id="dateModal" class="modal">
  <div class="modal-content">
    <h3 style="color:var(--blue); margin-bottom:15px;">मिति व्यवस्थापन</h3>
    <div class="row">
      <button class="btn-save btn-date-adj" style="flex:1; padding:10px;" onclick="adjustDayOnly(-1)">- १ गते</button>
      <button class="btn-save btn-date-adj" style="flex:1; padding:10px; background:var(--orange);" onclick="adjustDayOnly(1)">+ १ गते</button>
    </div>
    <button onclick="closeDateModal()" style="width:100%; margin-top:15px; padding:10px; background:var(--red); border:none; color:white; border-radius:10px; font-weight:800;">बन्द</button>
  </div>
</div>

<div id="mgrModal" class="modal"><div class="modal-content"><h3 id="mgrTitle"></h3><div class="row"><input type="text" id="mgrInput" style="flex:1"><button id="addBtnGlobal" onclick="addMgrItem()" style="background:var(--green); border:none; padding:0 15px; border-radius:8px; color:black; font-weight:bold;">ADD</button></div><div id="mgrList" class="m-list"></div><button onclick="closeMgr()" style="width:100%; padding:10px; background:var(--red); border:none; color:white; border-radius:10px; font-weight:bold;">CLOSE</button></div></div>

<script>
let manualOffset = 0; 
let baseEngDate = new Date(); 
let dayOffsetOnly = 0; 
const nD = ['०','१','२','३','४','५','६','७','८','९'];
const toN = n => n.toString().replace(/\d/g, d => nD[d]);

let globalEntryType = "Institution";
let serverSettingsGlobal = { busNumber: [], driverName: [], instName: [], tripList: [], lastOffset: 0 };

function openDateModal() { document.getElementById('dateModal').style.display = 'flex'; }
function closeDateModal() { document.getElementById('dateModal').style.display = 'none'; }

function pickADDate(val) {
  if(!val) return;
  baseEngDate = new Date(val);
  manualOffset = 0; 
  dayOffsetOnly = 0; 
  updateBSDate();
}

function adjustDayOnly(v) {
  dayOffsetOnly += v;
  updateBSDate();
}

function updateBSDate() {
  let calcD = new Date(baseEngDate);
  calcD.setDate(calcD.getDate() + manualOffset);
  
  const diffTime = calcD - new Date("2026-04-14"); 
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  
  let y = 2083, m = 1, d = diffDays + 1;
  const mDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30]; 
  for(let i=0; i<12; i++){
    if(d > mDays[i]) { d -= mDays[i]; m++; } else break;
  }
  
  let finalDay = d + dayOffsetOnly;
  if(finalDay < 1) finalDay = 1; 
  if(finalDay > mDays[m-1]) finalDay = mDays[m-1];
  
  const mNames = ["वैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कात्तिक", "मंसिर", "पुष", "माघ", "फागुन", "चैत"];
  const dNames = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  
  const currentBar = dNames[calcD.getDay()];
  
  const formattedBS = `${toN(y)} ${mNames[m-1]} ${toN(finalDay < 10 ? '0' + finalDay : finalDay)} ${currentBar}`;
  document.getElementById('bsDisplay').innerText = formattedBS;

  window.nepaliMonthStr = mNames[m-1];
  window.nepaliFullRawDate = `${y}-${m < 10 ? '0' + m : m}-${finalDay < 10 ? '0' + finalDay : finalDay}`;
  window.nepaliDayStr = currentBar;
}

function switchSection(t) {
  globalEntryType = t;
  document.getElementById('tInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resFields').style.display = t==='Reserve'?'block':'none';
  reCalc();
}

function pv(i) { if(i.files&&i.files[0]){const r=new FileReader(); r.onload=e=>document.getElementById('photoBtn').innerHTML=`<img src="${e.target.result}">`; r.readAsDataURL(i.files[0]);} }

/* डिजेल सेक्सनको कुनै पनि २ वटा कोठा भरिएमा स्वतः तेस्रो हिसाब गर्ने फङ्ग्सन */
function dfc(changedField) { 
  let lit = parseFloat(document.getElementById('dLit').value);
  let rat = parseFloat(document.getElementById('dRat').value);
  let amt = parseFloat(document.getElementById('dAmt').value);
  
  if (changedField === 'lit' || changedField === 'rat') {
    if (!isNaN(lit) && !isNaN(rat)) {
      document.getElementById('dAmt').value = Math.round(lit * rat);
    } else if (!isNaN(lit) && !isNaN(amt) && lit > 0 && changedField === 'lit') {
      document.getElementById('dRat').value = (amt / lit).toFixed(2);
    } else if (!isNaN(rat) && !isNaN(amt) && rat > 0 && changedField === 'rat') {
      document.getElementById('dLit').value = (amt / rat).toFixed(2);
    }
  } 
  else if (changedField === 'amt') {
    if (!isNaN(amt) && !isNaN(rat) && rat > 0) {
      document.getElementById('dLit').value = (amt / rat).toFixed(2);
    } else if (!isNaN(amt) && !isNaN(lit) && lit > 0) {
      document.getElementById('dRat').value = (amt / lit).toFixed(2);
    }
  }

  if(globalEntryType === "Reserve") reCalc();
}

function reCalc() { 
  let a=parseFloat(document.getElementById('resAmt').value)||0;
  let e=parseFloat(document.getElementById('resExp').value)||0; 
  let dAmt = parseFloat(document.getElementById('dAmt').value)||0;
  
  let totalSavings = (globalEntryType === "Reserve") ? (a - e - dAmt) : (a - e);
  document.getElementById('resSav').innerText = toN(totalSavings); 
}

function upKM() { 
  let s=parseFloat(toEngNum(document.getElementById('oKM').innerText))||0; 
  let c=parseFloat(document.getElementById('cKM').value)||0; 
  document.getElementById('rKM').innerText=toN(c>s?Math.round(c-s):0); 
}

function toEngNum(n) {
  const nepDigits = {'०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9'};
  return n.toString().replace(/[०-९]/g, d => nepDigits[d]);
}

function fetchOldKM() {
  let bus = document.getElementById('busNumber').value;
  if(!bus) return;
  if(typeof google !== 'undefined') {
    google.script.run.withSuccessHandler(function(km) {
      document.getElementById('oKM').innerText = toN(km || 0);
      upKM();
    }).getLastKM(bus, window.nepaliMonthStr);
  }
}

function saveFormRecord() {
  let fileInput = document.getElementById('pFile');
  Swal.fire({ title: 'डाटा सुरक्षित हुँदैछ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

  let calcD = new Date(baseEngDate);
  calcD.setDate(calcD.getDate() + manualOffset);

  const payload = {
    nepMonthName: window.nepaliMonthStr,
    nepDateRaw: window.nepaliFullRawDate,
    nepDay: window.nepaliDayStr,
    engDate: calcD.toISOString().split('T')[0],
    entryType: globalEntryType,
    busNumber: document.getElementById('busNumber').value,
    instName: document.getElementById('instName').value,
    driverName: document.getElementById('driverName').value,
    shift: document.getElementById('shiftSelect').value,
    trip: document.getElementById('tripSelectHeader').value,
    dLiter: document.getElementById('dLit').value,
    dRate: document.getElementById('dRat').value,
    dAmount: document.getElementById('dAmt').value,
    lastKM: toEngNum(document.getElementById('oKM').innerText), 
    currentKM: document.getElementById('cKM').value,
    routeFrom: document.getElementById('fromLoc') ? document.getElementById('fromLoc').value : "",
    routeTo: document.getElementById('toLoc') ? document.getElementById('toLoc').value : "",
    totalReserveAmount: document.getElementById('resAmt') ? document.getElementById('resAmt').value : "0",
    staffAllowance: document.getElementById('resExp') ? document.getElementById('resExp').value : "0",
    balance: toEngNum(document.getElementById('resSav').innerText),
    remarks: document.getElementById('rem').value,
    manualOffsetSaved: dayOffsetOnly.toString() 
  };

  if (fileInput.files && fileInput.files[0]) {
    let file = fileInput.files[0];
    let r = new FileReader();
    r.onload = function(e) {
      let bits = e.target.result.split(',');
      let photoObj = { base64: bits[1], mimeType: file.type, fileName: file.name };
      sendToServer(payload, photoObj);
    };
    r.readAsDataURL(file);
  } else {
    sendToServer(payload, null);
  }
}

function sendToServer(payload, photoObj) {
  if(typeof google !== 'undefined') {
    google.script.run
      .withSuccessHandler(function(res) {
        Swal.close();
        if(res === "SUCCESS") {
          Swal.fire({
            title: 'सफलता',
            text: 'डाटा सुरक्षित भयो !',
            icon: 'success',
            timer: 3000, 
            showConfirmButton: true
          }).then(() => {
            document.getElementById('mainForm').reset();
            document.getElementById('photoBtn').innerHTML = `<i class="fas fa-camera"></i>`;
            document.getElementById('shiftSelect').value = "दुवै";
            document.getElementById('resSav').innerText = "०";
            document.getElementById('rKM').innerText = "०";
            document.getElementById('oKM').innerText = "०";
            loadServerSettings();
          });
        } else {
          Swal.fire('त्रुटि', res, 'error');
        }
      })
      .withFailureHandler(function(err) {
        Swal.close();
        Swal.fire('त्रुटि', err.toString(), 'error');
      })
      .process(payload, photoObj);
  } else {
    Swal.close();
    Swal.fire('लोकल मोड', 'गुगल स्क्रिप्ट नभेटिएकाले DATA SAVE हुन सकेन।', 'info');
  }
}

let currentKey = "";
function openMgr(k, t) { 
  currentKey = k; 
  document.getElementById('mgrTitle').innerText = t; 
  renderMgr(); 
  document.getElementById('mgrModal').style.display = 'flex'; 
}
function closeMgr() { document.getElementById('mgrModal').style.display = 'none'; }

function renderMgr() { 
  let mappedKey = currentKey === 'tripList' ? 'tripList' : currentKey;
  let items = serverSettingsGlobal[mappedKey] || [];
  document.getElementById('mgrList').innerHTML = items.map((it, i) => 
    `<div class="m-item"><span>${it}</span><i class="fas fa-trash" onclick="deleteMgrItem('${it}')" style="color:var(--red); cursor:pointer;"></i></div>`
  ).join(''); 
}

function addMgrItem() { 
  let v = document.getElementById('mgrInput').value.trim(); 
  if(!v) return;
  Swal.fire({ title: 'थपिँदैछ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
  
  if(typeof google !== 'undefined') {
    google.script.run.withSuccessHandler(function(res) {
      Swal.close();
      document.getElementById('mgrInput').value = "";
      loadServerSettings();
    }).saveSettingToSheet(currentKey, v);
  }
}

function deleteMgrItem(val) {
  Swal.fire({ title: 'हटाइँदैछ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
  if(typeof google !== 'undefined') {
    google.script.run.withSuccessHandler(function(res) {
      Swal.close();
      loadServerSettings();
    }).removeSettingFromSheet(currentKey, val);
  }
}

function loadServerSettings() {
  if(typeof google !== 'undefined') {
    google.script.run.withSuccessHandler(function(settings) {
      serverSettingsGlobal = settings;
      
      const fields = [
        { id: 'busNumber', list: settings.busNumber, last: settings.lastBus, label: 'छान्नुहोस्' },
        { id: 'driverName', list: settings.driverName, last: settings.lastDriver, label: 'छान्नुहोस्' },
        { id: 'instName', list: settings.instName, last: settings.lastInstitution, label: 'छान्नुहोस्' },
        { id: 'tripSelectHeader', list: settings.tripList, last: settings.lastTrip, label: 'ट्रिप' }
      ];
      
      fields.forEach(f => {
        let el = document.getElementById(f.id);
        if(el) {
          let html = `<option value="">${f.label}</option>`;
          f.list.forEach(item => {
            let selected = (f.last && f.last.toString().trim() === item.toString().trim()) ? 'selected' : '';
            html += `<option value="${item}" ${selected}>${item}</option>`;
          });
          el.innerHTML = html;
        }
      });
      
      if(settings.lastOffset) {
        dayOffsetOnly = parseInt(settings.lastOffset) || 0;
        updateBSDate();
      }
      
      if(currentKey) renderMgr();
      fetchOldKM();
    }).getSettings();
  }
}

window.onload = () => {
  updateBSDate();
  loadServerSettings();
};
</script>
</body>
</html>
