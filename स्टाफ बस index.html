<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Mukta:wght@600;800&display=swap');
    :root { --bg: #0b0f1a; --card: #161e2d; --text: #f1f5f9; --border: #2d3748; --blue: #38bdf8; --green: #10b981; --red: #ef4444; --orange: #f59e0b; --purple: #a855f7; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta', sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; }
    .header { padding: 10px 15px; background: linear-gradient(90deg, #1e293b, #0f172a); border-bottom: 3px solid var(--blue); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    #bsDisplay { font-size: 15px; font-weight: 800; color: #fff; text-shadow: 0 0 10px var(--blue); }
    .header-right { display: flex; gap: 8px; }
    .head-sel { background: #0f172a; color: var(--blue); border: 1.5px solid var(--blue); border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 800; outline: none; }
    .container { padding: 12px; max-width: 500px; margin: auto; }
    .setting-bar { display: flex; gap: 8px; margin-bottom: 15px; }
    .set-btn { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px 2px; text-align: center; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .set-btn i { font-size: 20px; display: block; margin-bottom: 4px; }
    .set-btn span { font-size: 10px; font-weight: 800; color: #cbd5e1; }
    .btn-bus i { color: #3b82f6; } .btn-driver i { color: #10b981; } .btn-inst i { color: #f59e0b; } .btn-trip i { color: #a855f7; } .btn-date i { color: #f43f5e; }
    
    /* Center Toggles */
    .tab-row { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
    .tab-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; background: #1e293b; color: #94a3b8; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .tab-btn.active { background: linear-gradient(135deg, var(--blue), #1d4ed8); color: white; box-shadow: 0 5px 15px rgba(59,130,246,0.4); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 15px; margin-bottom: 15px; position: relative; overflow: hidden; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 5px; background: var(--blue); }
    .label { font-size: 11px; color: var(--blue); font-weight: 800; margin-bottom: 5px; display: block; }
    
    input, select, .km-box { width: 100%; height: 42px; border-radius: 10px; background: #0f172a; border: 1.5px solid var(--border); color: #fff; font-size: 15px; font-weight: 700; outline: none; text-align: center; display: flex; align-items: center; justify-content: center; }
    .km-box { border: 2px solid var(--green); color: var(--green); font-family: 'Orbitron'; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    .col { flex: 1; }
    
    #photoBtn { width: 50px; height: 50px; background: rgba(56,189,248,0.1); border: 2px dashed var(--blue); color: var(--blue); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
    #photoBtn img { width: 100%; height: 100%; object-fit: cover; }
    .btn-save { background: linear-gradient(135deg, #06b6d4, #10b981); border: none; padding: 18px; border-radius: 15px; color: #fff; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; box-shadow: 0 10px 20px rgba(16,185,129,0.3); }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; padding: 20px; }
    .modal-content { background:var(--card); padding:25px; border-radius:20px; border:2px solid var(--blue); width:100%; max-width:350px; }
  </style>
</head>
<body>

<div class="header">
  <div id="bsDisplay">२०८३/०१/३० बुधबार</div>
  <div class="header-right">
    <select id="tripSelectHeader" class="head-sel"><option value="">ट्रिप</option></select>
    <select id="shiftSelect" class="head-sel"><option value="बिहान">बिहान</option><option value="दिउँसो">दिउँसो</option><option value="दुवै">दुवै</option><option value="विदा">विदा</option></select>
  </div>
</div>

<div class="container">
  <div class="setting-bar">
    <div class="set-btn btn-bus" onclick="openMgr('busNumber', 'बस सेटिङ')"><i class="fas fa-bus"></i><span>बस</span></div>
    <div class="set-btn btn-driver" onclick="openMgr('driverName', 'ड्राइभर सेटिङ')"><i class="fas fa-user-tie"></i><span>ड्राइभर</span></div>
    <div class="set-btn btn-inst" onclick="openMgr('instName', 'संस्था सेटिङ')"><i class="fas fa-university"></i><span>संस्था</span></div>
    <div class="set-btn btn-trip" onclick="openMgr('tripList', 'ट्रिप सेटिङ')"><i class="fas fa-route"></i><span>ट्रिप</span></div>
    <div class="set-btn btn-date" onclick="openDateModal()"><i class="fas fa-calendar-alt"></i><span>गते +/-</span></div>
  </div>

  <div class="tab-row">
    <button id="tInst" class="tab-btn active" onclick="switchSection('Institution')">नियमित संस्था</button>
    <button id="tRes" class="tab-btn" onclick="switchSection('Reserve')">रिजर्भ सेक्सन</button>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="row">
        <div class="col"><span class="label">बस नम्बर</span><select id="busNumber"></select></div>
        <div id="instCol" class="col"><span class="label">संस्था</span><select id="instName"></select></div>
        <div class="col"><span class="label">ड्राइभर</span><select id="driverName"></select></div>
      </div>
      <div id="resFields" style="display:none; border-top:1px solid #334155; padding-top:10px; margin-top:5px;">
        <div class="row"><div class="col"><span class="label">कहाँबाट</span><input type="text" id="fromLoc"></div><div class="col"><span class="label">कहाँसम्म</span><input type="text" id="toLoc"></div></div>
        <div class="row"><div class="col"><span class="label">भाडा</span><input type="number" id="resAmt" oninput="reCalc()"></div><div class="col"><span class="label">खर्च</span><input type="number" id="resExp" oninput="reCalc()"></div><div class="col"><span class="label">बचत</span><div id="resSav" class="km-box" style="color:var(--orange); border-color:var(--orange)">०</div></div></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="col"><span class="label">स्टार्ट KM</span><div id="oKM" class="km-box">०</div></div>
        <div class="col"><span class="label">आजको KM</span><input type="number" id="cKM" oninput="upKM()"></div>
        <div class="col"><span class="label">चलेको</span><div id="rKM" class="km-box" style="color:var(--blue); border-color:var(--blue)">०</div></div>
      </div>
    </div>

    <div class="card" style="border-left-color: var(--green);">
      <div class="row"><div class="col"><span class="label">लिटर</span><input type="number" id="dLit" oninput="dfc()"></div><div class="col"><span class="label">रेट</span><input type="number" id="dRat" oninput="dfc()"></div><div class="col"><span class="label">डिजेल रकम</span><div id="dAmtBox" class="km-box" style="color:white; border-color:var(--border); font-size:15px">०</div></div></div>
      <div class="row" style="align-items: flex-end;"><div class="col" style="flex:3"><span class="label">कैफियत</span><input type="text" id="rem"></div><div class="col" style="display:flex; flex-direction:column; align-items:center;"><span class="label">फोटो</span><div id="photoBtn" onclick="document.getElementById('pFile').click()"><i class="fas fa-camera"></i></div><input type="file" id="pFile" accept="image/*" style="display:none" onchange="pv(this)"></div></div>
    </div>
    <button type="button" class="btn-save" id="saveBtn" onclick="saveData()">SAVE (सुरक्षित गर्नुहोस्)</button>
  </form>
</div>

<div id="dateModal" class="modal"><div class="modal-content"><h3 style="color:var(--blue); text-align:center; margin-bottom:20px;">मिति व्यवस्थापन</h3><div class="row"><button class="btn-save" style="flex:1; padding:10px" onclick="adjD(-1)">- १ गते</button><button class="btn-save" style="flex:1; padding:10px; background:var(--orange)" onclick="adjD(1)">+ १ गते</button></div><div style="background:#0f172a; padding:15px; border-radius:12px; margin-top:10px"><span class="label" style="text-align:center">क्यालेन्डर</span><input type="date" id="adPicker" onchange="pickDate(this.value)"></div><button onclick="closeDateModal()" style="width:100%; margin-top:20px; padding:12px; background:var(--red); border:none; color:white; border-radius:12px; font-weight:800">बन्द</button></div></div>
<div id="mgrModal" class="modal"><div class="modal-content"><h3 id="mgrTitle" style="color:var(--blue); margin-bottom:15px; text-align:center"></h3><div class="row"><input type="text" id="mgrInput" style="flex:1" placeholder="नाम..."><button onclick="addMgrItem()" style="background:var(--green); border:none; padding:0 15px; border-radius:10px; color:white; font-weight:900">थप्नुहोस्</button></div><div id="mgrList" style="max-height:200px; overflow-y:auto; margin:15px 0; border:1px solid var(--border); border-radius:10px"></div><button onclick="closeMgr()" style="width:100%; padding:12px; background:var(--red); border:none; color:white; border-radius:12px; font-weight:800">बन्द</button></div></div>

<script>
let manualOffset = 0; let baseDate = new Date(); let currentKey = "";
const nD = ['०','१','२','३','४','५','६','७','८','९'];
const toN = n => n.toString().replace(/\d/g, d => nD[d]);

function updateBS() {
  let d = new Date(baseDate); d.setDate(d.getDate() + manualOffset);
  const diff = Math.floor((d - new Date("2026-04-14")) / 86400000);
  let y = 2083, m = 1, day = diff + 1;
  const mDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30];
  for(let i=0; i<12; i++){ if(day > mDays[i]) { day -= mDays[i]; m++; } else break; }
  const mNames = ["वैशाख","जेठ","असार","साउन","भदौ","असोज","कात्तिक","मंसिर","पुष","माघ","फागुन","चैत"];
  const dNames = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  let mm = m < 10 ? '०' + toN(m) : toN(m);
  let dd = day < 10 ? '०' + toN(day) : toN(day);
  window.nepMonthName = `${toN(y)} ${mNames[m-1]}`;
  window.nepDateRaw = `${toN(y)}/${mm}/${dd}`;
  window.nepDay = dNames[d.getDay()];
  window.engDateFormatted = d.toISOString().split('T')[0];
  document.getElementById('bsDisplay').innerText = `${window.nepDateRaw} ${window.nepDay}`;
}

function switchSection(t){
  window.currentType = t;
  document.getElementById('tInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resFields').style.display = t==='Reserve'?'block':'none';
}

function dfc(){ let l=parseFloat(document.getElementById('dLit').value)||0, r=parseFloat(document.getElementById('dRat').value)||0; document.getElementById('dAmtBox').innerText=toN(Math.round(l*r)); }
function reCalc(){ let a=parseFloat(document.getElementById('resAmt').value)||0, e=parseFloat(document.getElementById('resExp').value)||0; document.getElementById('resSav').innerText=toN(Math.round(a-e)); }
function upKM(){ let c=parseFloat(document.getElementById('cKM').value)||0; document.getElementById('rKM').innerText=toN(c>0?c:0); }
function pv(i){ if(i.files&&i.files[0]){ const r=new FileReader(); r.onload=e=>document.getElementById('photoBtn').innerHTML=`<img src="${e.target.result}">`; r.readAsDataURL(i.files[0]); } }

function openMgr(k, t){ currentKey=k; document.getElementById('mgrTitle').innerText=t; renderMgr(); document.getElementById('mgrModal').style.display='flex'; }
function closeMgr(){ document.getElementById('mgrModal').style.display='none'; }
function renderMgr(){ let it=JSON.parse(localStorage.getItem(currentKey))||[]; document.getElementById('mgrList').innerHTML=it.map((x,i)=>`<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #2d3748; color:#fff; font-weight:600"><span>${x}</span><i class="fas fa-trash" style="color:var(--red); cursor:pointer" onclick="delMgr(${i})"></i></div>`).join(''); }
function addMgrItem(){ let v=document.getElementById('mgrInput').value; if(!v)return; let it=JSON.parse(localStorage.getItem(currentKey))||[]; it.push(v); localStorage.setItem(currentKey, JSON.stringify(it)); document.getElementById('mgrInput').value=""; renderMgr(); updateDrop(); }
function delMgr(i){ let it=JSON.parse(localStorage.getItem(currentKey))||[]; it.splice(i,1); localStorage.setItem(currentKey, JSON.stringify(it)); renderMgr(); updateDrop(); }
function updateDrop(){
  [['busNumber','busNumber'],['instName','instName'],['driverName','driverName'],['tripSelectHeader','tripList']].forEach(x=>{
    let d=document.getElementById(x[0]), it=JSON.parse(localStorage.getItem(x[1]))||[];
    d.innerHTML=`<option value="">${x[0].includes('trip')?'ट्रिप':'छान्नुहोस्'}</option>`+it.map(y=>`<option value="${y}">${y}</option>`).join('');
  });
}

function saveData(){
  const btn = document.getElementById('saveBtn');
  if(!document.getElementById('busNumber').value) return Swal.fire({icon:'error', title:'बस नम्बर छान्नुहोस्'});
  btn.disabled=true; btn.innerText="सुरक्षित हुँदै...";
  
  const data = {
    nepDateRaw: window.nepDateRaw, nepDay: window.nepDay, nepMonthName: window.nepMonthName, engDate: window.engDateFormatted,
    busNumber: document.getElementById('busNumber').value, instName: document.getElementById('instName').value || "-",
    driverName: document.getElementById('driverName').value, trip: document.getElementById('tripSelectHeader').value,
    shift: document.getElementById('shiftSelect').value, dLiter: document.getElementById('dLit').value || 0,
    dRate: document.getElementById('dRat').value || 0, dAmount: document.getElementById('dAmtBox').innerText.replace(/[^0-9]/g,'') || 0,
    lastKM: 0, currentKM: document.getElementById('cKM').value || 0, drivenKM: document.getElementById('rKM').innerText.replace(/[^0-9]/g,'') || 0,
    fromLoc: document.getElementById('fromLoc').value || "-", toLoc: document.getElementById('toLoc').value || "-", 
    resAmt: document.getElementById('resAmt').value || 0, resExp: document.getElementById('resExp').value || 0, 
    resSav: document.getElementById('resSav').innerText.replace(/[^0-9]/g,'') || 0, remarks: document.getElementById('rem').value || "-"
  };

  const file = document.getElementById('pFile').files[0];
  if(file){
    const r = new FileReader();
    r.onload=e=>google.script.run.withSuccessHandler(res=>done(res,btn)).process(data,{base64:e.target.result.split(',')[1],mimeType:file.type,fileName:file.name});
    r.readAsDataURL(file);
  } else google.script.run.withSuccessHandler(res=>done(res,btn)).process(data,null);
}

function done(res,btn){
  btn.disabled=false; btn.innerText="SAVE (सुरक्षित गर्नुहोस्)";
  if(res==="SUCCESS"){ Swal.fire({icon:'success', title:'सुरक्षित भयो'}); document.getElementById('mainForm').reset(); document.getElementById('photoBtn').innerHTML='<i class="fas fa-camera"></i>'; }
  else Swal.fire({icon:'error', title:res});
}

function openDateModal(){ document.getElementById('dateModal').style.display='flex'; }
function closeDateModal(){ document.getElementById('dateModal').style.display='none'; }
function pickDate(v){ if(!v) return; baseDate = new Date(v); manualOffset = 0; updateBS(); }
function adjD(v){ manualOffset += v; updateBS(); }

window.onload=()=>{ updateBS(); updateDrop(); switchSection('Institution'); };
</script>
</body>
</html>
