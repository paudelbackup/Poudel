<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Mukta:wght@600;800&display=swap');
    :root { --bg: #0b0f1a; --card: #161e2d; --text: #f1f5f9; --border: #2d3748; --blue: #38bdf8; --green: #10b981; --red: #ef4444; --orange: #f59e0b; --purple: #a855f7; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta', sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; }
    
    .header { padding: 15px; background: linear-gradient(90deg, #1e293b, #0f172a); border-bottom: 3px solid var(--blue); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    #bsDisplay { font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 0 10px var(--blue); }
    
    .container { padding: 12px; max-width: 600px; margin: auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 15px; position: relative; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 6px; background: var(--blue); border-radius: 20px 0 0 20px; }
    
    .label { font-size: 12px; color: var(--blue); font-weight: 800; margin-bottom: 6px; display: block; text-align: center; }
    input, select, .km-box { width: 100%; height: 48px; border-radius: 10px; background: #0f172a; border: 2px solid var(--border); color: #fff; font-size: 16px; font-weight: 700; outline: none; text-align: center; display: flex; align-items: center; justify-content: center; }
    .km-box { border-color: var(--green); color: var(--green); font-family: 'Orbitron'; font-size: 18px; }
    
    .row-triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    .row-double { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
    
    .tab-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; background: #1e293b; color: #94a3b8; font-weight: 800; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, var(--blue), #1d4ed8); color: white; box-shadow: 0 5px 15px rgba(59,130,246,0.4); }

    .btn-save { background: linear-gradient(135deg, #06b6d4, #10b981); border: none; padding: 20px; border-radius: 15px; color: #fff; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; box-shadow: 0 10px 20px rgba(16,185,129,0.3); margin-top: 10px; }
    
    .setting-bar { display: flex; gap: 6px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .set-btn { min-width: 70px; flex: 1; background: var(--card); border: 1px solid var(--border); padding: 10px 2px; text-align: center; border-radius: 12px; cursor: pointer; }
    .set-btn i { font-size: 20px; display: block; margin-bottom: 4px; }
    .set-btn span { font-size: 10px; font-weight: 800; color: #cbd5e1; }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center; padding: 20px; }
    .modal-content { background:var(--card); padding:25px; border-radius:25px; border:2px solid var(--blue); width:100%; max-width:380px; }
  </style>
</head>
<body>

<div class="header">
  <div id="bsDisplay">...</div>
  <div style="display:flex; gap:6px;">
    <select id="tripSelectHeader" style="height:35px; width:75px; font-size:11px; border-color:var(--blue); color:white; background:#0f172a;"></select>
    <select id="shiftSelect" style="height:35px; width:75px; font-size:11px; border-color:var(--blue); color:white; background:#0f172a;">
      <option value="बिहान">बिहान</option><option value="दिउँसो">दिउँसो</option><option value="दुवै">दुवै</option><option value="विदा">विदा</option>
    </select>
  </div>
</div>

<div class="container">
  <div class="setting-bar">
    <div class="set-btn" onclick="openMgr('busNumber', 'बस सेटिङ')" style="color:var(--blue)"><i class="fas fa-bus"></i><span>बस</span></div>
    <div class="set-btn" onclick="openMgr('driverName', 'ड्राइभर सेटिङ')" style="color:var(--green)"><i class="fas fa-user-tie"></i><span>ड्राइभर</span></div>
    <div class="set-btn" onclick="openMgr('instName', 'संस्था सेटिङ')" style="color:var(--orange)"><i class="fas fa-university"></i><span>संस्था</span></div>
    <div class="set-btn" onclick="openMgr('tripList', 'ट्रिप सेटिङ')" style="color:var(--purple)"><i class="fas fa-route"></i><span>ट्रिप</span></div>
    <div class="set-btn" onclick="openDateModal()" style="color:var(--red)"><i class="fas fa-calendar-alt"></i><span>मिति</span></div>
  </div>

  <div class="tab-row">
    <button id="tInst" class="tab-btn active" onclick="switchSection('Institution')">नियमित संस्था</button>
    <button id="tRes" class="tab-btn" onclick="switchSection('Reserve')">रिजर्भ सेक्सन</button>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="row-triple">
        <div class="col"><span class="label">बस नम्बर</span><select id="busNumber"></select></div>
        <div class="col"><span class="label">ड्राइभर</span><select id="driverName"></select></div>
        <div class="col" id="instCol"><span class="label">संस्था</span><select id="instName"></select></div>
      </div>
      
      <div id="resFields" style="display:none; margin-top:5px; padding-top:10px; border-top:1px solid var(--border);">
        <div class="row-double"><div class="col"><span class="label">कहाँबाट</span><input type="text" id="fromLoc"></div><div class="col"><span class="label">कहाँसम्म</span><input type="text" id="toLoc"></div></div>
        <div class="row-triple">
          <div class="col"><span class="label">भाडा</span><input type="number" id="resAmt" oninput="reCalc()"></div>
          <div class="col"><span class="label">खर्च</span><input type="number" id="resExp" oninput="reCalc()"></div>
          <div class="col"><span class="label">बचत</span><div id="resSav" class="km-box" style="color:var(--orange); border-color:var(--orange)">०</div></div>
        </div>
      </div>

      <div class="row-triple" style="margin-top:10px;">
        <div class="col"><span class="label">स्टार्ट KM</span><div id="oKM" class="km-box" style="color:#94a3b8; border-color:var(--border)">०</div></div>
        <div class="col"><span class="label">आजको KM</span><input type="number" id="cKM" oninput="upKM()" placeholder="0000"></div>
        <div class="col"><span class="label">चलेको KM</span><div id="rKM" class="km-box" style="color:var(--blue); border-color:var(--blue)">०</div></div>
      </div>
    </div>

    <div class="card" style="border-left-color: var(--green);">
      <div class="row-triple">
        <div class="col"><span class="label">लिटर</span><input type="number" id="dLit" oninput="dfc()"></div>
        <div class="col"><span class="label">रेट</span><input type="number" id="dRat" oninput="dfc()"></div>
        <div class="col"><span class="label">डिजेल रकम</span><div id="dAmtBox" class="km-box" style="color:#fff; border-color:var(--border); font-size:16px">०</div></div>
      </div>
      <div class="row-double" style="align-items: flex-end; grid-template-columns: 3fr 1fr;">
        <div class="col"><span class="label">कैफियत</span><input type="text" id="rem"></div>
        <div class="col" style="display:flex; flex-direction:column; align-items:center;">
          <span class="label">फोटो</span>
          <div id="photoBtn" onclick="document.getElementById('pFile').click()" style="width:48px; height:48px; border:2px dashed var(--blue); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
            <i class="fas fa-camera" style="font-size:20px; color:var(--blue)"></i>
          </div>
          <input type="file" id="pFile" accept="image/*" style="display:none" onchange="pv(this)">
        </div>
      </div>
    </div>
    <button type="button" class="btn-save" id="saveBtn" onclick="saveData()">SAVE (डाटा सुरक्षित गर्नुहोस्)</button>
  </form>
</div>

<div id="dateModal" class="modal"><div class="modal-content">
  <h3 style="color:var(--blue); text-align:center; margin-bottom:20px;">मिति व्यवस्थापन</h3>
  <div class="row-double"><button class="btn-save" style="flex:1; padding:10px" onclick="adjD(-1)">- १ गते</button><button class="btn-save" style="flex:1; padding:10px; background:var(--orange)" onclick="adjD(1)">+ १ गते</button></div>
  <input type="date" id="adPicker" onchange="pickDate(this.value)" style="margin-top:15px; width:100%; height:45px; border-radius:10px; text-align:center;">
  <button onclick="closeDateModal()" style="width:100%; margin-top:20px; padding:12px; background:var(--red); border:none; color:white; border-radius:12px; font-weight:800">बन्द</button>
</div></div>

<div id="mgrModal" class="modal"><div class="modal-content">
  <h3 id="mgrTitle" style="color:var(--blue); text-align:center; margin-bottom:15px;"></h3>
  <div class="row-double" style="grid-template-columns: 3fr 1fr;"><input type="text" id="mgrInput"><button onclick="addMgrItem()" style="background:var(--green); border:none; border-radius:10px; color:white;"><i class="fas fa-plus"></i></button></div>
  <div id="mgrList" style="max-height:250px; overflow-y:auto; margin:15px 0; border:1px solid var(--border); border-radius:10px"></div>
  <button onclick="closeMgr()" style="width:100%; padding:12px; background:var(--red); border:none; color:white; border-radius:12px; font-weight:800">बन्द</button>
</div></div>

<script>
let manualOffset = 0; let baseDate = new Date(); let currentKey = "";
const nD = ['०','१','२','३','४','५','६','७','८','९'];
const toN = n => n.toString().replace(/\d/g, d => nD[d]);

function updateBS() {
  let d = new Date(baseDate); 
  d.setDate(d.getDate() + manualOffset);
  const diff = Math.floor((d - new Date("2026-04-14")) / 86400000);
  let y = 2083, m = 1, day = diff + 1;
  const mDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30];
  for(let i=0; i<12; i++){ if(day > mDays[i]) { day -= mDays[i]; m++; } else break; }
  const mNames = ["वैशाख","जेठ","असार","साउन","भदौ","असोज","कात्तिक","मंसिर","पुष","माघ","फागुन","चैत"];
  const dNames = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  let mm = m < 10 ? '०' + toN(m) : toN(m);
  let dd = day < 10 ? '०' + toN(day) : toN(day);
  window.nepMonthName = `${toN(y)} ${mNames[m-1]}`;
  window.nepDateRaw = `${toN(y)}/${mm}/${dd}`;
  window.nepDay = dNames[d.getDay()];
  window.engDateFormatted = d.toISOString().split('T')[0];
  document.getElementById('bsDisplay').innerText = `${window.nepDateRaw} ${window.nepDay}`;
}

function switchSection(t){
  window.currentType = t;
  document.getElementById('tInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resFields').style.display = t==='Reserve'?'block':'none';
}

function dfc(){ 
  let l=parseFloat(document.getElementById('dLit').value)||0, r=parseFloat(document.getElementById('dRat').value)||0; 
  document.getElementById('dAmtBox').innerText=toN(Math.round(l*r)); 
}
function reCalc(){ 
  let a=parseFloat(document.getElementById('resAmt').value)||0, e=parseFloat(document.getElementById('resExp').value)||0; 
  document.getElementById('resSav').innerText=toN(Math.round(a-e)); 
}
function upKM(){ 
  let c=parseFloat(document.getElementById('cKM').value)||0; 
  document.getElementById('rKM').innerText=toN(c > 0 ? c : 0); 
}
function pv(i){ if(i.files&&i.files[0]){ const r=new FileReader(); r.onload=e=>document.getElementById('photoBtn').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">`; r.readAsDataURL(i.files[0]); } }

function openMgr(k, t){ currentKey=k; document.getElementById('mgrTitle').innerText=t; renderMgr(); document.getElementById('mgrModal').style.display='flex'; }
function closeMgr(){ document.getElementById('mgrModal').style.display='none'; }
function renderMgr(){ 
  let it=JSON.parse(localStorage.getItem(currentKey))||[]; 
  document.getElementById('mgrList').innerHTML=it.map((x,i)=>`<div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #2d3748; color:#fff; font-weight:600"><span>${x}</span><i class="fas fa-trash" style="color:var(--red); cursor:pointer" onclick="delMgr(${i})"></i></div>`).join(''); 
}
function addMgrItem(){ 
  let v=document.getElementById('mgrInput').value; if(!v)return; 
  let it=JSON.parse(localStorage.getItem(currentKey))||[]; it.push(v); 
  localStorage.setItem(currentKey, JSON.stringify(it)); 
  document.getElementById('mgrInput').value=""; renderMgr(); updateDrop(); 
}
function delMgr(i){ 
  let it=JSON.parse(localStorage.getItem(currentKey))||[]; it.splice(i,1); 
  localStorage.setItem(currentKey, JSON.stringify(it)); renderMgr(); updateDrop(); 
}

function updateDrop(){
  [['busNumber','busNumber'],['instName','instName'],['driverName','driverName'],['tripSelectHeader','tripList']].forEach(x=>{
    let d=document.getElementById(x[0]), it=JSON.parse(localStorage.getItem(x[1]))||[];
    d.innerHTML=`<option value="">${x[0].includes('trip')?'ट्रिप':'छान्नुहोस्'}</option>`+it.map(y=>`<option value="${y}">${y}</option>`).join('');
  });
}

function saveData(){
  const btn = document.getElementById('saveBtn');
  if(!document.getElementById('busNumber').value) return Swal.fire({icon:'error', title:'बस नम्बर छान्नुहोस्'});
  btn.disabled=true; btn.innerText="सुरक्षित हुँदै...";
  const data = {
    entryType: window.currentType, nepDateRaw: window.nepDateRaw, nepDay: window.nepDay, nepMonthName: window.nepMonthName, engDate: window.engDateFormatted,
    busNumber: document.getElementById('busNumber').value, instName: document.getElementById('instName').value || "-",
    driverName: document.getElementById('driverName').value, trip: document.getElementById('tripSelectHeader').value,
    shift: document.getElementById('shiftSelect').value, dLiter: document.getElementById('dLit').value || 0,
    dRate: document.getElementById('dRat').value || 0, lastKM: 0, currentKM: document.getElementById('cKM').value || 0,
    fromLoc: document.getElementById('fromLoc').value || "-", toLoc: document.getElementById('toLoc').value || "-", 
    resAmt: document.getElementById('resAmt').value || 0, resExp: document.getElementById('resExp').value || 0, 
    remarks: document.getElementById('rem').value || "-"
  };
  const file = document.getElementById('pFile').files[0];
  if(file){
    const r = new FileReader();
    r.onload=e=>google.script.run.withSuccessHandler(res=>done(res,btn)).process(data,{base64:e.target.result.split(',')[1],mimeType:file.type,fileName:file.name});
    r.readAsDataURL(file);
  } else google.script.run.withSuccessHandler(res=>done(res,btn)).process(data,null);
}
function done(res,btn){
  btn.disabled=false; btn.innerText="SAVE (डाटा सुरक्षित गर्नुहोस्)";
  if(res==="SUCCESS"){ Swal.fire({icon:'success', title:'डाटा सुरक्षित भयो'}); document.getElementById('mainForm').reset(); document.getElementById('photoBtn').innerHTML='<i class="fas fa-camera" style="font-size:20px; color:var(--blue)"></i>'; upKM(); dfc(); reCalc(); }
  else Swal.fire({icon:'error', title:res});
}

function openDateModal(){ document.getElementById('dateModal').style.display='flex'; }
function closeDateModal(){ document.getElementById('dateModal').style.display='none'; }
function pickDate(v){ if(!v) return; baseDate = new Date(v); manualOffset = 0; updateBS(); closeDateModal(); }
function adjD(v){ manualOffset += v; updateBS(); }

// पेज खुल्ने बित्तिकै चल्ने फंक्सन
window.onload=()=>{ updateBS(); updateDrop(); switchSection('Institution'); };
</script>
</body>
</html>
