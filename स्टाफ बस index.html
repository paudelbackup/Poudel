<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@600;800&display=swap');
    :root { --bg: #0b0f1a; --card: #161e2d; --text: #f1f5f9; --border: #2d3748; --blue: #38bdf8; --green: #10b981; --red: #ef4444; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta', sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom: 20px; }
    
    .header { padding: 15px; background: #1e293b; border-bottom: 3px solid var(--blue); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .header-icons { display: flex; gap: 8px; align-items: center; }
    
    .container { padding: 12px; max-width: 600px; margin: auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
    
    .label { font-size: 13px; color: var(--blue); font-weight: 800; margin-bottom: 5px; display: block; text-align: center; }
    .label i { margin-right: 5px; }

    input, select, .km-box, textarea { width: 100%; height: 50px; border-radius: 10px; background: #0f172a; border: 2px solid var(--border); color: #fff; font-size: 16px; font-weight: 700; outline: none; text-align: center; display: block; }
    
    textarea { height: 80px; padding: 10px; text-align: left; resize: none; font-size: 14px; }
    
    .km-box { border-color: var(--green); color: var(--green); display: flex; align-items: center; justify-content: center; }
    .row-triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    
    .tab-btn { flex: 1; padding: 15px; border-radius: 10px; border: none; background: #1e293b; color: #94a3b8; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tab-btn.active { background: var(--blue); color: #000; }
    
    .btn-save { background: linear-gradient(135deg, #06b6d4, #10b981); border: none; padding: 18px; border-radius: 15px; color: #fff; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 10px; }
    
    .reserve-text { color: var(--red) !important; border-color: var(--red) !important; }
    .loader-spin { border: 3px solid #f3f3f3; border-top: 3px solid var(--blue); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <div id="bsDisplay" style="font-weight: 800;"><i class="fas fa-calendar-alt"></i> लोड हुँदै...</div>
  <div class="header-icons">
    <i class="fas fa-route" style="color: var(--blue);"></i>
    <select id="tripSelectHeader" style="height:35px; width:85px; font-size:11px; padding:0;"></select>
    
    <i class="fas fa-clock" style="color: var(--blue);"></i>
    <select id="shiftSelect" style="height:35px; width:85px; font-size:11px; padding:0;">
      <option value="बिहान">बिहान</option>
      <option value="दिउँसो">दिउँसो</option>
      <option value="दुवै">दुवै</option>
    </select>
  </div>
</div>

<div class="container">
  <div class="tab-row" style="display:flex; gap:10px; margin-bottom:15px;">
    <button id="tInst" class="tab-btn active" onclick="switchSection('Institution')"><i class="fas fa-university"></i> नियमित संस्था</button>
    <button id="tRes" class="tab-btn" onclick="switchSection('Reserve')"><i class="fas fa-bus-side"></i> रिजर्भ</button>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="row-triple">
        <div class="col"><span class="label"><i class="fas fa-bus"></i> बस नं</span><select id="busNumber" onchange="fetchKM()"></select></div>
        <div class="col"><span class="label"><i class="fas fa-user-tie"></i> ड्राइभर</span><select id="driverName"></select></div>
        <div class="col" id="instCol"><span class="label"><i class="fas fa-building"></i> संस्था</span><select id="instName"></select></div>
      </div>
      
      <div id="resFields" style="display:none;">
        <div class="row-triple">
           <input type="text" id="fromLoc" placeholder="कहाँबाट" class="reserve-text">
           <input type="text" id="toLoc" placeholder="कहाँसम्म" class="reserve-text">
           <input type="number" id="resAmt" placeholder="कुल भाडा" oninput="reCalc()" class="reserve-text">
        </div>
        <div class="row-triple">
           <div class="col"><span class="label"><i class="fas fa-wallet"></i> खर्च</span><input type="number" id="resExp" oninput="reCalc()" class="reserve-text"></div>
           <div class="col"><span class="label"><i class="fas fa-piggy-bank"></i> बचत</span><div id="resSav" class="km-box" style="color:var(--red); border-color:var(--red)">०</div></div>
        </div>
      </div>

      <div class="row-triple">
        <div class="col"><span class="label">पहिलेको KM</span><input type="number" id="pKM" readonly style="background:#2d3748"></div>
        <div class="col"><span class="label">आजको KM</span><input type="number" id="cKM" oninput="upKM()"></div>
        <div class="col"><span class="label">चलेको KM</span><div id="rKM" class="km-box">०</div></div>
      </div>
    </div>

    <div class="card">
      <div class="row-triple">
        <div class="col"><span class="label">लिटर</span><input type="number" id="dLit" oninput="calcDiesel('L')"></div>
        <div class="col"><span class="label">रेट</span><input type="number" id="dRat" oninput="calcDiesel('R')"></div>
        <div class="col"><span class="label">रकम</span><input type="number" id="dAmt" oninput="calcDiesel('A')"></div>
      </div>
      <div class="row-triple" style="grid-template-columns: 2fr 1fr;">
        <div class="col"><span class="label"><i class="fas fa-edit"></i> विवरण (Remarks)</span><textarea id="rem" placeholder="विवरण यहाँ लेख्नुहोस्..."></textarea></div>
        <div class="col">
          <span class="label"><i class="fas fa-camera"></i> फोटो</span>
          <div id="photoBtn" onclick="document.getElementById('pFile').click()" style="height:80px;border:2px dashed var(--blue);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;"><i class="fas fa-camera fa-2x"></i><span style="font-size:10px;margin-top:5px;">Click</span></div>
          <input type="file" id="pFile" accept="image/*" style="display:none" onchange="pv(this)">
        </div>
      </div>
    </div>
    <button type="button" class="btn-save" id="saveBtn" onclick="saveData()">डाटा सुरक्षित गर्नुहोस्</button>
  </form>
</div>

<script>
let windowData = { nepMonthName: "", nepDateRaw: "", nepDay: "", engDate: "" };

// मिति अपडेट गर्ने
function updateBS() {
  let d = new Date();
  const diff = Math.floor((d - new Date("2026-04-14")) / 86400000);
  let y = 2083, m = 1, day = diff + 1;
  const mDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30];
  for(let i=0; i<12; i++){ if(day > mDays[i]) { day -= mDays[i]; m++; } else break; }
  const mNames = ["वैशाख","जेठ","असार","साउन","भदौ","असोज","कात्तिक","मंसिर","पुष","माघ","फागुन","चैत"];
  windowData.nepMonthName = `${y} ${mNames[m-1]}`;
  windowData.nepDateRaw = `${y}/${m < 10 ? '0'+m : m}/${day < 10 ? '0'+day : day}`;
  windowData.nepDay = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"][d.getDay()];
  windowData.engDate = d.toISOString().split('T')[0];
  document.getElementById('bsDisplay').innerHTML = `<i class="fas fa-calendar-alt"></i> ${windowData.nepDateRaw} ${windowData.nepDay}`;
}

// सर्भरबाट डाटा तान्ने
function updateDrop() {
  google.script.run.withSuccessHandler(s => {
    document.getElementById('busNumber').innerHTML = '<option value="">बस नं</option>' + s.busNumber.map(x=>`<option value="${x}">${x}</option>`).join('');
    document.getElementById('driverName').innerHTML = '<option value="">ड्राइभर</option>' + s.driverName.map(x=>`<option value="${x}">${x}</option>`).join('');
    document.getElementById('instName').innerHTML = '<option value="">संस्था</option>' + s.instName.map(x=>`<option value="${x}">${x}</option>`).join('');
    document.getElementById('tripSelectHeader').innerHTML = '<option value="">ट्रिप</option>' + s.tripList.map(x=>`<option value="${x}">${x}</option>`).join('');
  }).getSettingsFromServer();
}

function fetchKM() {
  let b = document.getElementById('busNumber').value;
  if(!b) return;
  google.script.run.withSuccessHandler(km => {
    document.getElementById('pKM').value = km;
    upKM();
  }).getLastKM(b);
}

function calcDiesel(type) {
  let l = parseFloat(document.getElementById('dLit').value) || 0;
  let r = parseFloat(document.getElementById('dRat').value) || 0;
  let a = parseFloat(document.getElementById('dAmt').value) || 0;
  if (type === 'L' || type === 'R') {
    if (l && r) document.getElementById('dAmt').value = (l * r).toFixed(2);
  } else if (type === 'A') {
    if (a && r) document.getElementById('dLit').value = (a / r).toFixed(2);
  }
}

function upKM() {
  let p = parseFloat(document.getElementById('pKM').value) || 0;
  let c = parseFloat(document.getElementById('cKM').value) || 0;
  document.getElementById('rKM').innerText = c > p ? (c - p) : 0;
}

function switchSection(t){
  window.currentType = t;
  document.getElementById('tInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.visibility = t==='Institution'?'visible':'hidden';
  document.getElementById('resFields').style.display = t==='Reserve'?'block':'none';
}

function reCalc(){ 
  let a=parseFloat(document.getElementById('resAmt').value)||0, e=parseFloat(document.getElementById('resExp').value)||0; 
  document.getElementById('resSav').innerText=Math.round(a-e); 
}

function pv(i){ if(i.files[0]){ const r=new FileReader(); r.onload=e=>document.getElementById('photoBtn').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;border-radius:10px;object-fit:cover;">`; r.readAsDataURL(i.files[0]); } }

function saveData(){
  const btn = document.getElementById('saveBtn');
  const bus = document.getElementById('busNumber').value;
  if(!bus) { Swal.fire('कृपया बस नम्बर छान्नुहोस्'); return; }
  
  btn.disabled=true; 
  btn.innerHTML='<span class="loader-spin"></span> सुरक्षित हुँदै...';

  const data = {
    ...windowData, entryType: window.currentType,
    busNumber: bus, instName: document.getElementById('instName').value || "-",
    driverName: document.getElementById('driverName').value, trip: document.getElementById('tripSelectHeader').value || "-",
    shift: document.getElementById('shiftSelect').value, dLiter: document.getElementById('dLit').value || 0,
    dRate: document.getElementById('dRat').value || 0, dAmount: document.getElementById('dAmt').value || 0,
    prevKM: document.getElementById('pKM').value || 0, currentKM: document.getElementById('cKM').value || 0,
    fromLoc: document.getElementById('fromLoc').value || "-", toLoc: document.getElementById('toLoc').value || "-", 
    resAmt: document.getElementById('resAmt').value || 0, resExp: document.getElementById('resExp').value || 0, 
    remarks: document.getElementById('rem').value || "-"
  };
  
  const file = document.getElementById('pFile').files[0];
  if(file){
    const r = new FileReader();
    r.onload=e=>google.script.run.withSuccessHandler(res=>done(res,btn)).process(data,{base64:e.target.result.split(',')[1],mimeType:file.type});
    r.readAsDataURL(file);
  } else google.script.run.withSuccessHandler(res=>done(res,btn)).process(data,null);
}

// डाटा सुरक्षित भएपछि गरिने कार्यहरू (Reset & Reload)
function done(res, btn){
  if(res==="SUCCESS"){ 
    Swal.fire({ icon:'success', title:'सुरक्षित भयो!', text: 'फारम रिसेट हुँदैछ...', timer: 2500, showConfirmButton: false }); 
    
    setTimeout(() => { 
      // फारम पूर्ण रिसेट
      document.getElementById('mainForm').reset();
      document.getElementById('rKM').innerText = "०";
      document.getElementById('resSav').innerText = "०";
      document.getElementById('photoBtn').innerHTML = '<i class="fas fa-camera fa-2x"></i><span style="font-size:10px;margin-top:5px;">Click</span>';
      
      btn.disabled=false; 
      btn.innerHTML="डाटा सुरक्षित गर्नुहोस्";
      
      // सिटको अन्तिम KM र ड्रपडाउन ताजा गर्न पेज रिलोड गर्ने
      location.reload(); 
    }, 2500);
  } else {
    Swal.fire('त्रुटि: ' + res);
    btn.disabled=false; 
    btn.innerHTML="डाटा सुरक्षित गर्नुहोस्";
  }
}

window.onload=()=>{ updateBS(); updateDrop(); switchSection('Institution'); };
</script>
</body>
</html>
