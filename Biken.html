<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Mukta:wght@600;800&display=swap');

    :root {
      --bg-main: #0f172a; --card-bg: #1e293b; 
      --neon-blue: #38bdf8; --neon-green: #4ade80;
      --neon-red: #fb7185; --neon-orange: #fb923c;
      --text-main: #f1f5f9; --border-color: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; text-align: center; }
    body { background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Header */
    .hud-header { padding: 8px 10px; background: var(--card-bg); border-bottom: 2px solid var(--neon-blue); display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    #bsDisplay { font-size: 16px; font-weight: 800; color: var(--neon-green); flex: 1; text-align: left; }
    
    .shift-mini { display: flex; gap: 3px; background: #0f172a; padding: 3px; border-radius: 8px; border: 1px solid var(--border-color); }
    .shift-mini input { display: none; }
    .shift-mini label { padding: 3px 10px; font-size: 12px; font-weight: 800; cursor: pointer; border-radius: 5px; color: #64748b; }
    #sMorning:checked + label { background: var(--neon-red); color: white; }
    #sAfternoon:checked + label { background: var(--neon-orange); color: white; }
    #sBoth:checked + label { background: var(--neon-green); color: black; }

    /* Layout */
    .dashboard { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 50px; }

    .setting-bar { display: flex; justify-content: space-around; background: var(--card-bg); padding: 8px; border-radius: 12px; border: 1px solid var(--neon-blue); }
    .set-btn { background: none; border: none; color: var(--neon-blue); font-size: 20px; cursor: pointer; flex: 1; }
    .set-btn span { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; margin-top: 2px; }

    /* Date Menu Popover */
    .date-pop { 
      display: none; position: fixed; top: 110px; left: 50%; transform: translateX(-50%); 
      background: var(--card-bg); border: 2px solid var(--neon-blue); padding: 20px; 
      border-radius: 15px; z-index: 10001; box-shadow: 0 10px 50px #000; width: 85%; max-width: 300px;
    }
    .offset-btn { background: #334155; border: 1px solid var(--neon-blue); color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 900; }

    /* Tabs */
    .tab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .tab-btn { padding: 12px; border-radius: 10px; border: 1px solid var(--neon-blue); background: rgba(56, 189, 248, 0.1); color: var(--neon-blue); font-weight: 800; font-size: 16px; cursor: pointer; }
    .tab-btn.active { background: var(--neon-blue); color: #000; }

    /* Forms */
    .control-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 12px; }
    .label-ai { font-size: 11px; color: var(--neon-blue); font-weight: 800; margin-bottom: 4px; text-transform: uppercase; }
    
    input, select, .km-monitor { 
      width: 100%; height: 42px; border-radius: 8px; background: #0f172a; 
      border: 1.5px solid var(--border-color); color: white; font-size: 16px; 
      font-weight: 700; text-align: center; display: flex; align-items: center; justify-content: center; outline: none;
    }
    .km-monitor { border: 2px solid var(--neon-green); color: var(--neon-green); font-family: 'Orbitron'; font-size: 19px; }
    
    .row { display: flex; gap: 6px; margin-bottom: 8px; width: 100%; }
    .col { flex: 1; min-width: 0; }

    /* Photo Icon & Preview */
    #photoBtn { 
      width: 100%; height: 42px; background: rgba(56,189,248,0.1); 
      border: 1.5px solid var(--neon-blue); color: var(--neon-blue); 
      border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; 
    }
    #photoBtn img { width: 100%; height: 100%; object-fit: cover; }

    .btn-execute { background: linear-gradient(135deg, #38bdf8, #4ade80); border: none; padding: 18px; border-radius: 12px; color: #000; font-size: 20px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 10px; }

    /* Modals */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:20000; align-items:center; justify-content:center; padding:20px; }
  </style>
</head>
<body>

<div class="hud-header">
  <div id="bsDisplay">लोड हुँदैछ...</div>
  <div class="shift-mini">
    <input type="radio" name="shift" id="sMorning" value="बिहान" onchange="updateShift('#fb7185')">
    <label for="sMorning">बिहान</label>
    <input type="radio" name="shift" id="sAfternoon" value="दिउँसो" onchange="updateShift('#fb923c')">
    <label for="sAfternoon">दिउँसो</label>
    <input type="radio" name="shift" id="sBoth" value="दुवै" checked onchange="updateShift('#4ade80')">
    <label for="sBoth">दुवै</label>
  </div>
</div>

<div class="dashboard">
  <div class="setting-bar">
    <button type="button" class="set-btn" onclick="openManager('busNumber', 'बस सेटिङ')"><i class="fas fa-bus"></i><span>बस</span></button>
    <button type="button" class="set-btn" onclick="openManager('driverName', 'ड्राइभर सेटिङ')"><i class="fas fa-user-tie"></i><span>ड्राइभर</span></button>
    <button type="button" class="set-btn" onclick="openManager('instName', 'संस्था सेटिङ')"><i class="fas fa-university"></i><span>संस्था</span></button>
    <button type="button" class="set-btn" onclick="toggleDatePop()" style="color:var(--neon-orange)"><i class="fas fa-calendar-alt"></i><span>मिति</span></button>
  </div>

  <div id="datePop" class="date-pop">
    <div style="color:var(--neon-blue); font-size:14px; margin-bottom:15px; font-weight:800;">मिति मिलाउनुहोस् (+/-)</div>
    <div style="display:flex; justify-content: center; gap:10px;">
      <button type="button" class="offset-btn" onclick="changeOffset(-1)">- १ दिन</button>
      <button type="button" class="offset-btn" onclick="changeOffset(1)">+ १ दिन</button>
    </div>
    <button type="button" onclick="document.getElementById('engDate').showPicker(); toggleDatePop();" style="width:100%; margin-top:15px; padding:8px; background:rgba(255,255,255,0.05); border:1px dashed #555; color:#aaa; border-radius:8px;">अंग्रेजी क्यालेन्डर</button>
  </div>

  <div class="tab-grid">
    <button type="button" id="tabInst" class="tab-btn active" onclick="setEntryType('Institution')">संस्था</button>
    <button type="button" id="tabRes" class="tab-btn" onclick="setEntryType('Reserve')">रिजर्भ</button>
  </div>

  <form id="busForm">
    <div class="control-card">
      <input type="hidden" id="entryType" name="entryType" value="Institution">
      <input type="hidden" id="lastKM" name="lastKM" value="0">
      <input type="hidden" id="shiftColor" name="shiftColor" value="#4ade80">
      <input type="date" id="engDate" name="engDate" style="display:none" onchange="calcNepaliDate()">

      <div class="row">
        <div class="col"><div class="label-ai">बस नम्बर</div><select id="busNumber" name="busNumber" onchange="fetchLastKM(this.value)"></select></div>
        <div class="col"><div class="label-ai">ड्राइभर</div><select id="driverName" name="driverName"></select></div>
        <div class="col" id="instCol"><div class="label-ai">संस्था</div><select id="instName" name="instName"></select></div>
      </div>

      <div id="resSection" style="display:none" class="row">
        <div class="col"><div class="label-ai">कहाँबाट</div><input type="text" name="routeFrom"></div>
        <div class="col"><div class="label-ai">कहाँसम्म</div><input type="text" name="routeTo"></div>
      </div>

      <div class="row">
        <div class="col"><div class="label-ai">डिजल लिटर</div><input type="number" id="dLiter" name="dLiter" oninput="fuelCalc('LIT')" step="any" inputmode="decimal"></div>
        <div class="col"><div class="label-ai">रेट</div><input type="number" id="dRate" name="dRate" oninput="fuelCalc('RAT')" step="any" inputmode="decimal"></div>
        <div class="col"><div class="label-ai">डिजल रकम</div><input type="number" id="dAmount" name="dAmount" oninput="fuelCalc('AMT')" step="any" inputmode="decimal"></div>
      </div>

      <div class="row">
        <div class="col"><div class="label-ai">पुरानो KM</div><div id="oldKMDisp" class="km-monitor">०</div></div>
        <div class="col"><div class="label-ai">आजको KM</div><input type="number" id="currentKM" name="currentKM" oninput="calcRunKM()" inputmode="decimal"></div>
        <div class="col"><div class="label-ai">चलेको KM</div><div id="runKMDisp" class="km-monitor" style="border-color:var(--neon-blue); color:var(--neon-blue);">०</div></div>
      </div>

      <div id="reserveCalc" style="display:none; border-top:1px solid var(--border-color); padding-top:10px; margin-top:5px;">
        <div class="row">
          <div class="col"><div class="label-ai">भाडा</div><input type="number" id="totalRes" name="totalReserveAmount" oninput="resCalc()" inputmode="decimal"></div>
          <div class="col"><div class="label-ai">खर्च</div><input type="number" id="exp" name="staffAllowance" oninput="resCalc()" inputmode="decimal"></div>
          <div class="col"><div class="label-ai">बचत</div><input type="number" id="balance" name="balance" readonly style="color:var(--neon-green)"></div>
        </div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col" style="flex: 4;">
          <div class="label-ai">कैफियत</div>
          <input type="text" name="remarks" id="remarks" placeholder="यहाँ लेख्नुहोस्...">
        </div>
        <div class="col" style="flex: 1;">
          <div class="label-ai">फोटो</div>
          <div id="photoBtn" onclick="document.getElementById('photoFile').click()"><i class="fas fa-camera"></i></div>
          <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="previewImage(this)">
        </div>
      </div>
    </div>
    <button type="button" class="btn-execute" id="saveBtn" onclick="submitData()">डाटा सुरक्षित गर्नुहोस्</button>
  </form>
</div>

<div id="managerModal" class="modal">
  <div class="modal-content" style="background:var(--card-bg); padding:20px; border-radius:15px; border:2px solid var(--neon-blue); width:90%; max-width:350px;">
    <h3 id="mTitle" style="color:var(--neon-blue); margin-bottom:15px;">सेटिङ</h3>
    <div class="row"><input type="text" id="newItemInp" placeholder="विवरण..."><button type="button" onclick="addItem()" style="background:var(--neon-green); padding:0 15px; border-radius:8px; border:none; font-weight:900;">ADD</button></div>
    <div id="itemList" style="max-height:200px; overflow-y:auto; margin:10px 0; text-align:left;"></div>
    <button type="button" onclick="closeModal()" style="width:100%; padding:10px; background:var(--neon-red); border:none; color:white; border-radius:10px;">बन्द</button>
  </div>
</div>

<script>
let dateOffset = 0;
const nepDigits = ['०','१','२','३','४','५','६','७','८','९'];
function toNep(n) { return (n === undefined || n === null || n === "") ? "०" : n.toString().replace(/\d/g, d => nepDigits[d]); }

// मिति व्यवस्थापन
function toggleDatePop() { 
  let p = document.getElementById('datePop');
  p.style.display = (p.style.display === 'block') ? 'none' : 'block';
}

function changeOffset(val) { dateOffset += val; calcNepaliDate(); }

function calcNepaliDate() {
  let d = new Date(document.getElementById('engDate').value || new Date());
  d.setDate(d.getDate() + dateOffset); // Offset लागू गर्ने
  
  // यो लजिक २०८३ सालको लागि मात्र सीमित छ (सरल बनाउन)
  let anchorEng = new Date("2026-04-14"); // १ वैशाख २०८३
  let diff = Math.floor((d - anchorEng) / 86400000);
  
  let year = 2083, month = 1, day = diff + 1;
  const monthDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30]; // २०८३ को क्यालेन्डर अनुसार
  
  for (let i = 0; i < monthDays.length; i++) {
    if (day > monthDays[i]) { day -= monthDays[i]; month++; } else break;
  }
  
  const monthNames = ["वैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कात्तिक", "मंसिर", "पुष", "माघ", "फागुन", "चैत"];
  const days = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  
  window.nepMonthName = monthNames[month-1];
  window.nepDay = days[d.getDay()];
  window.nepDateRaw = year + "/" + (month < 10 ? '0'+month : month) + "/" + (day < 10 ? '0'+day : day);
  
  document.getElementById('bsDisplay').innerText = toNep(year) + " " + window.nepMonthName + " " + toNep(day < 10 ? '0'+day : day) + " " + window.nepDay;
}

// फोटो प्रिभ्यू
function previewImage(input) {
  const btn = document.getElementById('photoBtn');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => { btn.innerHTML = `<img src="${e.target.result}">`; };
    reader.readAsDataURL(input.files[0]);
  }
}

// गणना लजिक
function fuelCalc(type) {
  let lit = parseFloat(document.getElementById('dLiter').value) || 0;
  let rat = parseFloat(document.getElementById('dRate').value) || 0;
  let amt = parseFloat(document.getElementById('dAmount').value) || 0;
  if (type === 'LIT' || type === 'RAT') { if(lit && rat) document.getElementById('dAmount').value = Math.round(lit * rat); }
  else if (type === 'AMT' && rat) { document.getElementById('dLiter').value = (amt / rat).toFixed(2); }
  resCalc();
}

function resCalc() {
  let t = parseFloat(document.getElementById('totalRes').value) || 0;
  let d = parseFloat(document.getElementById('dAmount').value) || 0;
  let e = parseFloat(document.getElementById('exp').value) || 0;
  document.getElementById('balance').value = Math.round(t - (d + e));
}

function fetchLastKM(bus) {
  if(!bus) return;
  document.getElementById('oldKMDisp').innerText = '...';
  google.script.run.withSuccessHandler(km => {
    document.getElementById('lastKM').value = km;
    document.getElementById('oldKMDisp').innerText = toNep(km);
    calcRunKM();
  }).getLastKM(bus, window.nepMonthName);
}

function calcRunKM() {
  let old = parseFloat(document.getElementById('lastKM').value) || 0;
  let curr = parseFloat(document.getElementById('currentKM').value) || 0;
  document.getElementById('runKMDisp').innerText = toNep(curr > old ? (curr - old) : 0);
}

// UI म्यानेजमेन्ट
function setEntryType(t) {
  document.getElementById('entryType').value = t;
  document.getElementById('tabInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tabRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resSection').style.display = t==='Reserve'?'flex':'none';
  document.getElementById('reserveCalc').style.display = t==='Reserve'?'block':'none';
}

function updateShift(color) { document.getElementById('shiftColor').value = color; }

// Settings Manager
let currentSettingKey = "";
function openManager(key, title) {
  currentSettingKey = key; document.getElementById('mTitle').innerText = title;
  renderList(); document.getElementById('managerModal').style.display = 'flex';
}
function closeModal() { document.getElementById('managerModal').style.display = 'none'; }

function renderList() {
  let items = JSON.parse(localStorage.getItem(currentSettingKey)) || [];
  document.getElementById('itemList').innerHTML = items.map((it, i) => `
    <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #334155;">
      <span style="color:white">${it}</span><i class="fas fa-trash" onclick="removeItem(${i})" style="color:var(--neon-red); cursor:pointer"></i>
    </div>`).join('');
}

function addItem() {
  let v = document.getElementById('newItemInp').value; if(!v) return;
  google.script.run.withSuccessHandler(() => {
    let items = JSON.parse(localStorage.getItem(currentSettingKey)) || [];
    items.push(v); localStorage.setItem(currentSettingKey, JSON.stringify(items));
    document.getElementById('newItemInp').value = ""; renderList(); updateDropdowns();
  }).saveSettingToSheet(currentSettingKey, v);
}

function removeItem(i) {
  let items = JSON.parse(localStorage.getItem(currentSettingKey)) || [];
  google.script.run.removeSettingFromSheet(currentSettingKey, items[i]);
  items.splice(i, 1); localStorage.setItem(currentSettingKey, JSON.stringify(items));
  renderList(); updateDropdowns();
}

function updateDropdowns() {
  ['busNumber', 'instName', 'driverName'].forEach(id => {
    let items = JSON.parse(localStorage.getItem(id)) || [];
    document.getElementById(id).innerHTML = '<option value="">छान्नुहोस्</option>' + items.map(x => `<option value="${x}">${x}</option>`).join('');
  });
}

// Data Submission
function submitData() {
  const btn = document.getElementById('saveBtn');
  if(!document.getElementById('busNumber').value) return Swal.fire({ icon:'error', title:'बस नम्बर छान्नुहोस्', background: '#1e293b', color: '#fff' });
  
  btn.disabled = true; btn.innerText = "सुरक्षित हुँदै...";
  
  const data = Object.fromEntries(new FormData(document.getElementById('busForm')).entries());
  data.shift = document.querySelector('input[name="shift"]:checked').value;
  data.nepDateRaw = window.nepDateRaw;
  data.nepDay = window.nepDay;
  data.nepMonthName = window.nepMonthName;
  data.lastKM = document.getElementById('lastKM').value;

  const file = document.getElementById('photoFile').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => { 
      google.script.run.withSuccessHandler(done).process(data, { 
        base64: e.target.result.split(',')[1], mimeType: file.type, fileName: file.name 
      }); 
    };
    reader.readAsDataURL(file);
  } else { 
    google.script.run.withSuccessHandler(done).process(data, null); 
  }
}

function done(res) {
  const btn = document.getElementById('saveBtn');
  if (res === "SUCCESS") { 
    Swal.fire({ icon:'success', title:'डाटा सुरक्षित भयो!', background: '#1e293b', color: '#fff' }); 
    document.getElementById('busForm').reset(); 
    document.getElementById('photoBtn').innerHTML='<i class="fas fa-camera"></i>'; 
    document.getElementById('oldKMDisp').innerText = "०";
    document.getElementById('runKMDisp').innerText = "०";
  } else { 
    Swal.fire({ icon:'error', title: res, background: '#1e293b', color: '#fff' }); 
  }
  btn.disabled = false; btn.innerText = "डाटा सुरक्षित गर्नुहोस्";
}

window.onload = () => {
  document.getElementById('engDate').value = new Date().toISOString().split('T')[0];
  calcNepaliDate();
  google.script.run.withSuccessHandler(s => {
    localStorage.setItem('busNumber', JSON.stringify(s.busNumber || []));
    localStorage.setItem('instName', JSON.stringify(s.instName || []));
    localStorage.setItem('driverName', JSON.stringify(s.driverName || []));
    updateDropdowns();
  }).getSettings();
};
</script>
</body>
</html>
