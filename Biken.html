<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Mukta:wght@600;800&display=swap');
    :root { --bg: #0f172a; --card: #1e293b; --blue: #38bdf8; --green: #4ade80; --red: #fb7185; --orange: #fb923c; --text: #f1f5f9; --border: #334155; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta', sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
    
    .header { 
      padding: 8px 12px; background: var(--card); border-bottom: 2px solid var(--blue); 
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000;
    }
    #bsDisplay { font-size: 14px; font-weight: 800; color: var(--green); flex: 2; text-align: left; }
    .header-right { display: flex; gap: 5px; flex: 3; justify-content: flex-end; }
    .head-sel { background: #0f172a; color: white; border: 1px solid var(--blue); border-radius: 5px; padding: 4px; font-size: 11px; font-weight: 800; outline: none; }

    /* सुधार १: दुई छेउमा पर्फेक्ट ग्याप राख्ने ओरिजिनल कन्टेनर */
    .container { padding: 12px; max-width: 600px; margin: auto; }
    
    .setting-bar { display: flex; gap: 5px; margin-bottom: 12px; }
    .set-btn { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 8px 2px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.2s; }
    .set-btn i { font-size: 18px; color: var(--blue); display: block; margin-bottom: 2px; }
    .set-btn span { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

    .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--blue); background: rgba(56,189,248,0.1); color: var(--blue); font-weight: 800; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--blue); color: #000; box-shadow: 0 0 10px rgba(56,189,248,0.4); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--blue); }
    .label { font-size: 10px; color: var(--blue); font-weight: 800; margin-bottom: 4px; text-transform: uppercase; text-align: left; }
    
    /* सुधार १: डेटा जतिसुकै लामो भए पनि होरिजन्टलमै सिधा बस्ने (No Double Row/Wrap) र टेक्स्ट सेन्टर हुने संरचना */
    input, select, .km-box { 
      width: 100%; height: 40px; border-radius: 8px; background: #0f172a; border: 1px solid var(--border); color: white; 
      font-size: 14px; font-weight: 700; outline: none; padding: 0 4px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    
    .km-box { border: 2px solid var(--green); color: var(--green); font-family: 'Orbitron'; display: flex; align-items: center; justify-content: center; }
    
    /* सुधार १: एउटै होरिजन्टल लाइनमा नटुटाई देखाउन फ्लेक्स रो नो-र्याप */
    .row { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 6px; margin-bottom: 10px; width: 100%; overflow: hidden; }
    .col { flex: 1; min-width: 0; }

    #photoBtn { width: 45px; height: 45px; background: rgba(56,189,248,0.1); border: 1.5px dashed var(--blue); color: var(--blue); border-radius: 8px; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    #photoBtn img { width: 100%; height: 100%; object-fit: cover; position: absolute; }

    .btn-save { background: linear-gradient(135deg, var(--blue), var(--green)); border: none; padding: 16px; border-radius: 15px; color: #000; font-size: 18px; font-weight: 900; width: 100%; cursor: pointer; }

    /* Modal Styles */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center; }
    .modal-content { background:var(--card); padding:20px; border-radius:15px; border:2px solid var(--blue); width:90%; max-width:320px; text-align: center; }
    .m-list { max-height: 200px; overflow-y: auto; margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; }
    .m-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); color: white; font-weight: 600; }
    
    /* Date Pop Specific */
    .date-pop-card { background: var(--bg); border: 1px solid var(--blue); border-radius: 10px; padding: 15px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="header">
  <div id="bsDisplay">२०८३ जेठ ५ बुधबार</div>
  <div class="header-right">
    <select id="tripSelectHeader" class="head-sel"><option>ट्रिप</option></select>
    <select id="shiftSelect" class="head-sel">
      <option value="बिहान">बिहान</option>
      <option value="दिउँसो">दिउँसो</option>
      <option value="दुवै" selected>दुवै</option>
      <option value="विदा">विदा</option>
    </select>
  </div>
</div>

<div class="container">
  <div class="setting-bar">
    <div class="set-btn" onclick="openMgr('busNumber', 'बस नम्बर सेटिङ')"><i class="fas fa-bus"></i><span>बस</span></div>
    <div class="set-btn" onclick="openMgr('driverName', 'ड्राइभर सेटिङ')"><i class="fas fa-user-tie"></i><span>ड्राइभर</span></div>
    <div class="set-btn" onclick="openMgr('instName', 'संस्था सेटिङ')"><i class="fas fa-university"></i><span>संस्था</span></div>
    <div class="set-btn" onclick="openMgr('tripList', 'ट्रिप सेटिङ')"><i class="fas fa-route"></i><span>ट्रिप</span></div>
    <div class="set-btn" onclick="openDateModal()"><i class="fas fa-calendar-alt"></i><span>गते +/-</span></div>
  </div>

  <div class="tab-row">
    <div id="tInst" class="tab-btn active" onclick="switchSection('Institution')">नियमित संस्था</div>
    <div id="tRes" class="tab-btn" onclick="switchSection('Reserve')">रिजर्भ सेक्सन</div>
  </div>

  <form id="mainForm">
    <div class="card">
      <div class="row">
        <div class="col"><div class="label">बस नम्बर</div><select id="busNumber"></select></div>
        <div class="col" id="instCol"><div class="label">संस्था</div><select id="instName"></select></div>
        <div class="col"><div class="label">ड्राइभर</div><select id="driverName"></select></div>
      </div>

      <div id="resFields" style="display:none; border-top: 1px solid #334155; padding-top: 10px; margin-top: 5px;">
        <div class="row"><div class="col"><div class="label">कहाँबाट</div><input type="text" id="fromLoc"></div><div class="col"><div class="label">कहाँसम्म</div><input type="text" id="toLoc"></div></div>
        <div class="row"><div class="col"><div class="label">भाडा</div><input type="number" id="resAmt" oninput="reCalc()"></div><div class="col"><div class="label">खर्च</div><input type="number" id="resExp" oninput="reCalc()"></div><div class="col"><div class="label">बचत</div><div id="resSav" class="km-box" style="color:var(--orange);">०</div></div></div>
      </div>

      <div class="row" style="margin-top:10px;">
        <div class="col"><div class="label">स्टार्ट KM</div><div id="oKM" class="km-box">०</div></div>
        <div class="col"><div class="label">आजको KM</div><input type="number" id="cKM" oninput="upKM()"></div>
        <div class="col"><div class="label">चलेको</div><div id="rKM" class="km-box" style="color:var(--blue);">०</div></div>
      </div>
    </div>

    <div class="card" style="border-left-color: var(--green);">
      <div class="row"><div class="col"><div class="label">लिटर</div><input type="number" id="dLit" oninput="dfc()"></div><div class="col"><div class="label">रेट</div><input type="number" id="dRat" oninput="dfc()"></div><div class="col"><div class="label">डिजेल रकम</div><input type="number" id="dAmt" readonly></div></div>
      <div class="row" style="align-items: flex-end;"><div class="col" style="flex:3"><div class="label">कैफियत</div><input type="text" id="rem"></div><div class="col"><div class="label">फोटो</div><div id="photoBtn" onclick="document.getElementById('pFile').click()"><i class="fas fa-camera"></i></div><input type="file" id="pFile" accept="image/*" style="display:none" onchange="pv(this)"></div></div>
    </div>
    <button type="button" class="btn-save" onclick="saveFormRecord()">डाटा सुरक्षित गर्नुहोस्</button>
  </form>
</div>

<div id="dateModal" class="modal">
  <div class="modal-content">
    <h3 style="color:var(--blue); margin-bottom:15px;">मिति व्यवस्थापन</h3>
    <div class="row">
      <button class="btn-save" style="flex:1; padding:10px;" onclick="adjustDay(-1)">- १ गते</button>
      <button class="btn-save" style="flex:1; padding:10px; background:var(--orange);" onclick="adjustDay(1)">+ १ गते</button>
    </div>
    <div class="date-pop-card">
      <div class="label" style="text-align:center">AD क्यालेन्डरबाट छान्नुहोस्</div>
      <input type="date" id="adPicker" onchange="pickADDate(this.value)">
    </div>
    <button onclick="closeDateModal()" style="width:100%; margin-top:15px; padding:10px; background:var(--red); border:none; color:white; border-radius:10px; font-weight:800;">बन्द</button>
  </div>
</div>

<div id="mgrModal" class="modal"><div class="modal-content"><h3 id="mgrTitle"></h3><div class="row"><input type="text" id="mgrInput" style="flex:1"><button onclick="addMgrItem()" style="background:var(--green); border:none; padding:0 15px; border-radius:8px;">ADD</button></div><div id="mgrList" class="m-list"></div><button onclick="closeMgr()" style="width:100%; padding:10px; background:var(--red); border:none; color:white; border-radius:10px;">CLOSE</button></div></div>

<script>
let manualOffset = 0; 
let baseEngDate = new Date(); 
const nD = ['०','१','२','३','४','५','६','७','८','९'];
const toN = n => n.toString().replace(/\d/g, d => nD[d]);

let globalEntryType = "Institution";

function openDateModal() { document.getElementById('dateModal').style.display = 'flex'; }
function closeDateModal() { document.getElementById('dateModal').style.display = 'none'; }

function pickADDate(val) {
  if(!val) return;
  baseEngDate = new Date(val);
  manualOffset = 0; 
  updateBSDate();
}

function adjustDay(v) {
  manualOffset += v;
  updateBSDate();
}

// सुधार ४: गते मात्र फेरबदल हुने र बार प्रस्ट रूपमा क्यालकुलेट हुने ओरिजिनल लजिक
function updateBSDate() {
  let calcD = new Date(baseEngDate);
  calcD.setDate(calcD.getDate() + manualOffset);
  
  const diffTime = calcD - new Date("2026-04-14"); 
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  
  let y = 2083, m = 1, d = diffDays + 1;
  const mDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30]; 
  for(let i=0; i<12; i++){
    if(d > mDays[i]) { d -= mDays[i]; m++; } else break;
  }
  
  const mNames = ["वैशाख","जेठ","असार","साउन","भदौ","असोज","कात्तिक","मंसिर","पुष","माघ","फागुन","चैत"];
  const dNames = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  
  const formattedBS = `${toN(y)} ${mNames[m-1]} ${toN(d < 10 ? '0' + d : d)} ${dNames[calcD.getDay()]}`;
  document.getElementById('bsDisplay').innerText = formattedBS;

  window.nepaliMonthStr = mNames[m-1];
  window.nepaliFullRawDate = `${y}-${m < 10 ? '0' + m : m}-${d < 10 ? '0' + d : d}`;
  window.nepaliDayStr = dNames[calcD.getDay()];
}

function switchSection(t) {
  globalEntryType = t;
  document.getElementById('tInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resFields').style.display = t==='Reserve'?'block':'none';
  reCalc();
}

function pv(i) { if(i.files&&i.files[0]){const r=new FileReader(); r.onload=e=>document.getElementById('photoBtn').innerHTML=`<img src="${e.target.result}">`; r.readAsDataURL(i.files[0]);} }
function dfc() { 
  let l=parseFloat(document.getElementById('dLit').value)||0, r=parseFloat(document.getElementById('dRat').value)||0; 
  document.getElementById('dAmt').value=Math.round(l*r); 
  if(globalEntryType === "Reserve") reCalc();
}

// सुधार २: रिजर्भको वास्तविक नाफा निकालिने फर्मुला: भाडा - खर्च - डिजेल रकम
function reCalc() { 
  let a=parseFloat(document.getElementById('resAmt').value)||0;
  let e=parseFloat(document.getElementById('resExp').value)||0; 
  let dAmt = parseFloat(document.getElementById('dAmt').value)||0;
  
  let totalSavings = (globalEntryType === "Reserve") ? (a - e - dAmt) : (a - e);
  document.getElementById('resSav').innerText = toN(totalSavings); 
}

function upKM() { let s=0, c=parseFloat(document.getElementById('cKM').value)||0; document.getElementById('rKM').innerText=toN(c>s?Math.round(c-s):0); }

function saveFormRecord() {
  let fileInput = document.getElementById('pFile');
  Swal.fire({ title: 'डाटा सुरक्षित हुँदैछ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

  let calcD = new Date(baseEngDate);
  calcD.setDate(calcD.getDate() + manualOffset);

  const payload = {
    nepMonthName: window.nepaliMonthStr,
    nepDateRaw: window.nepaliFullRawDate,
    nepDay: window.nepaliDayStr,
    engDate: calcD.toISOString().split('T')[0],
    entryType: globalEntryType,
    busNumber: document.getElementById('busNumber').value,
    instName: document.getElementById('instName').value,
    driverName: document.getElementById('driverName').value,
    shift: document.getElementById('shiftSelect').value,
    trip: document.getElementById('tripSelectHeader').value,
    dLiter: document.getElementById('dLit').value,
    dRate: document.getElementById('dRat').value,
    dAmount: document.getElementById('dAmt').value,
    lastKM: "0", 
    currentKM: document.getElementById('cKM').value,
    routeFrom: document.getElementById('fromLoc') ? document.getElementById('fromLoc').value : "",
    routeTo: document.getElementById('toLoc') ? document.getElementById('toLoc').value : "",
    totalReserveAmount: document.getElementById('resAmt') ? document.getElementById('resAmt').value : "0",
    staffAllowance: document.getElementById('resExp') ? document.getElementById('resExp').value : "0",
    balance: document.getElementById('resSav').innerText,
    remarks: document.getElementById('rem').value,
    manualOffsetSaved: manualOffset.toString()
  };

  if (fileInput.files && fileInput.files[0]) {
    let file = fileInput.files[0];
    let r = new FileReader();
    r.onload = function(e) {
      let bits = e.target.result.split(',');
      let photoObj = { base64: bits[1], mimeType: file.type, fileName: file.name };
      sendToServer(payload, photoObj);
    };
    r.readAsDataURL(file);
  } else {
    sendToServer(payload, null);
  }
}

function sendToServer(payload, photoObj) {
  google.script.run
    .withSuccessHandler(function(res) {
      Swal.close();
      if(res === "SUCCESS") {
        Swal.fire('सफलता', 'डाटा सुरक्षित भयो !', 'success');
        document.getElementById('mainForm').reset();
        document.getElementById('photoBtn').innerHTML = `<i class="fas fa-camera"></i>`;
        document.getElementById('shiftSelect').value = "दुवै";
        document.getElementById('resSav').innerText = "०";
        document.getElementById('rKM').innerText = "०";
      } else {
        Swal.fire('त्रुटि', res, 'error');
      }
    })
    .withFailureHandler(function(err) {
      Swal.close();
      Swal.fire('त्रुटि', err.toString(), 'error');
    })
    .process(payload, photoObj);
}

let currentKey = "";
function openMgr(k, t) { currentKey=k; document.getElementById('mgrTitle').innerText=t; renderMgr(); document.getElementById('mgrModal').style.display='flex'; }
function closeMgr() { document.getElementById('mgrModal').style.display='none'; }
function renderMgr() { let items=JSON.parse(localStorage.getItem(currentKey))||[]; document.getElementById('mgrList').innerHTML=items.map((it, i)=>`<div class="m-item"><span>${it}</span><i class="fas fa-trash" onclick="deleteMgrItem(${i})" style="color:var(--red)"></i></div>`).join(''); }
function addMgrItem() { let v=document.getElementById('mgrInput').value; if(!v)return; let items=JSON.parse(localStorage.getItem(currentKey))||[]; items.push(v); localStorage.setItem(currentKey, JSON.stringify(items)); document.getElementById('mgrInput').value=""; renderMgr(); updateDropdowns(); }
function deleteMgrItem(i) { let items=JSON.parse(localStorage.getItem(currentKey))||[]; items.splice(i,1); localStorage.setItem(currentKey, JSON.stringify(items)); renderMgr(); updateDropdowns(); }
function updateDropdowns() { ['busNumber', 'instName', 'driverName', 'tripSelectHeader'].forEach((id, idx) => { let k = ['busNumber', 'instName', 'driverName', 'tripList'][idx]; let it = JSON.parse(localStorage.getItem(k))||[]; let d = document.getElementById(id); if(d) d.innerHTML = `<option value="">${id==='tripSelectHeader'?'ट्रिप':'छान्नुहोस्'}</option>` + it.map(x=>`<option value="${x}">${x}</option>`).join(''); }); }

window.onload = () => {
  updateBSDate();
  updateDropdowns();
};
</script>
</body>
</html>
