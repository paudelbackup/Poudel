<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;600;700;800&display=swap');

    :root {
      --bg: #030712;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --blue-neon: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #030712);
      color: var(--text-main);
      min-height: 100vh;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky; top: 0; z-index: 1000;
    }

    .header-left { display: flex; align-items: center; gap: 10px; }

    .shift-group {
      display: flex; gap: 5px; background: rgba(0,0,0,0.4);
      padding: 3px; border-radius: 50px; border: 1px solid var(--glass-border);
    }
    .shift-btn { display: none; }
    .shift-label {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; font-size: 10px; font-weight: 800;
    }
    #sMorning:checked + .shift-label { background: var(--danger); color: white; box-shadow: 0 0 10px var(--danger); }
    #sAfternoon:checked + .shift-label { background: var(--warning); color: white; box-shadow: 0 0 10px var(--warning); }
    #sBoth:checked + .shift-label { background: var(--success); color: white; box-shadow: 0 0 10px var(--success); }

    .container { padding: 10px; max-width: 480px; margin: auto; }

    /* Small Tab Container */
    .tab-container {
      display: flex; gap: 8px; margin-bottom: 12px;
      background: rgba(0,0,0,0.2); padding: 4px; border-radius: 12px;
    }
    .tab {
      flex: 1; padding: 8px; text-align: center; border-radius: 10px;
      cursor: pointer; color: var(--text-dim); font-weight: 700;
      transition: 0.4s; font-size: 14px;
    }
    .tab.active { background: var(--accent); color: white; box-shadow: 0 4px 12px var(--accent-glow); }

    /* Small Date Box */
    .date-box {
      text-align: center; padding: 10px; border-radius: 15px;
      background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(56,189,248,0.05));
      border: 1px solid var(--accent); margin-bottom: 12px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 15px; border-radius: 18px; margin-bottom: 12px;
      border: 1px solid var(--glass-border);
    }

    label {
      display: block; font-size: 11px; text-transform: uppercase;
      color: var(--blue-neon); margin-bottom: 5px; font-weight: 700; padding-left: 3px;
    }

    /* Smaller Inputs */
    input, select {
      width: 100%; padding: 8px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(15, 23, 42, 0.6); color: #fff;
      font-size: 16px; transition: 0.3s;
    }
    input:focus, select:focus { border-color: var(--accent); outline: none; }

    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .col { flex: 1; }

    .val-badge {
      height: 40px; display: flex; align-items: center; justify-content: center;
      background: #0f172a; border-radius: 10px; border: 1px dashed #334155;
      font-weight: 800; font-size: 18px; color: var(--success);
    }

    .btn-save {
      width: 100%; padding: 15px; border-radius: 15px; border: none;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white; font-size: 18px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); margin-top: 5px;
    }
    .btn-save:active { transform: scale(0.97); }

    #photoBtn {
      width: 100%; height: 42px; border-radius: 10px; border: 2px dashed #475569;
      background: transparent; color: white; cursor: pointer;
    }
    #photoBtn.selected { border-color: var(--success); color: var(--success); }

    /* Overlay Menu & Modals */
    #menuOverlay { display:none; position:fixed; inset:0; background:rgba(2,6,23,0.8); backdrop-filter:blur(8px); z-index:2000; }
    .menu-content { position:absolute; right:15px; top:65px; width:220px; background:#1e293b; border-radius:20px; border:1px solid var(--accent); padding:8px; }
    .menu-item { padding:12px; border-radius:12px; display:flex; align-items:center; gap:10px; color:white; cursor:pointer; font-size: 15px; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:3000; align-items:center; justify-content:center; padding:20px; }
    .modal-box { background:#1e293b; padding:20px; border-radius:22px; width:100%; max-width:380px; border:1px solid var(--glass-border); }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="header-left">
    <div style="background: var(--accent); width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
      <i class="fas fa-bus" style="color: white; font-size: 18px;"></i>
    </div>
    <h2 style="font-size: 18px;">स्मार्ट बस</h2>
  </div>

  <div class="shift-group">
    <div class="shift-item">
      <input type="radio" name="shift" id="sMorning" value="Morning" class="shift-btn">
      <label for="sMorning" class="shift-label">बि</label>
    </div>
    <div class="shift-item">
      <input type="radio" name="shift" id="sAfternoon" value="Afternoon" class="shift-btn">
      <label for="sAfternoon" class="shift-label">दि</label>
    </div>
    <div class="shift-item">
      <input type="radio" name="shift" id="sBoth" value="Both" class="shift-btn" checked>
      <label for="sBoth" class="shift-label">दु</label>
    </div>
  </div>

  <div onclick="toggleMenu()" style="width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid var(--glass-border);">
    <i class="fas fa-bars" style="color:var(--accent);"></i>
  </div>
</div>

<div id="menuOverlay" onclick="toggleMenu()">
  <div class="menu-content" onclick="event.stopPropagation()">
    <div class="menu-item" onclick="openManager('busNumber', 'बस सेटिङ')"><i class="fas fa-bus"></i> बस सेटिङ</div>
    <div class="menu-item" onclick="openManager('driverName', 'ड्राइभर सेटिङ')"><i class="fas fa-user"></i> ड्राइभर सेटिङ</div>
    <div class="menu-item" onclick="openManager('instName', 'संस्था सेटिङ')"><i class="fas fa-school"></i> संस्था सेटिङ</div>
    <div class="menu-item" onclick="openDateTweak()"><i class="fas fa-calendar-alt"></i> गते मिलाउनुस्</div>
  </div>
</div>

<div class="container">
  <div class="tab-container">
    <div id="tabInst" class="tab active" onclick="setEntryType('Institution')">संस्था</div>
    <div id="tabRes" class="tab" onclick="setEntryType('Reserve')">रिजर्भ</div>
  </div>

  <div class="date-box">
    <div id="bsDisplay" style="font-size: 18px; font-weight: 700; color: white;">...</div>
  </div>

  <form id="busForm">
    <input type="hidden" id="entryType" name="entryType" value="Institution">
    <input type="hidden" id="lastKM" name="lastKM" value="0">
    
    <div class="card">
      <div class="row">
        <div class="col"><label>मिति (AD)</label><input type="date" id="engDate" name="engDate" onchange="calcNepaliDate()"></div>
        <div class="col" id="instCol"><label>संस्थाको नाम</label><select id="instName" name="instName"></select></div>
      </div>
      <div id="resSection" style="display:none;">
        <div class="row">
          <div class="col"><label>कहाँबाट</label><input type="text" name="routeFrom" placeholder="Source"></div>
          <div class="col"><label>कहाँसम्म</label><input type="text" name="routeTo" placeholder="Dest"></div>
        </div>
      </div>
      <div class="row">
        <div class="col"><label>ड्राइभर</label><select id="driverName" name="driverName"></select></div>
        <div class="col"><label>बस नम्बर</label><select id="busNumber" name="busNumber" onchange="fetchLastKM(this.value)"></select></div>
      </div>
    </div>
    
    <div class="card" style="background: rgba(15, 23, 42, 0.8);">
      <div class="row">
        <div class="col"><label>लिटर</label><input type="number" id="dLiter" name="dLiter" oninput="fuelCalc('LIT')" step="any" inputmode="decimal"></div>
        <div class="col"><label>रेट</label><input type="number" id="dRate" name="dRate" oninput="fuelCalc('RAT')" step="any" inputmode="decimal"></div>
        <div class="col"><label>रकम</label><input type="number" id="dAmount" name="dAmount" oninput="fuelCalc('AMT')" step="any" inputmode="decimal"></div>
      </div>
      <div class="row">
        <div class="col"><label>पुरानो KM</label><div id="oldKMDisp" class="val-badge" style="color:var(--text-dim)">०</div></div>
        <div class="col"><label>आजको KM</label><input type="number" id="currentKM" name="currentKM" oninput="calcRunKM()" inputmode="decimal"></div>
        <div class="col"><label>चलेको KM</label><div id="runKMDisp" class="val-badge">०</div></div>
      </div>
    </div>

    <div id="reserveCalc" class="card" style="display:none; border-color: var(--danger);">
      <div class="row">
        <div class="col"><label>रिजर्भ रकम</label><input type="number" id="totalRes" name="totalReserveAmount" oninput="resCalc()"></div>
        <div class="col"><label>खर्च</label><input type="number" id="exp" name="staffAllowance" oninput="resCalc()"></div>
        <div class="col"><label>बचत</label><input type="number" id="balance" name="balance" readonly style="color:var(--success); font-weight:800;"></div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="align-items: flex-end;">
        <div class="col" style="flex: 2.5;"><label>कैफियत</label><input type="text" name="remarks" placeholder="..."></div>
        <div class="col"><label>फोटो</label>
          <button type="button" id="photoBtn" onclick="document.getElementById('photoFile').click()"><i class="fas fa-camera"></i></button>
          <input type="file" id="photoFile" accept="image/*" style="display:none;" onchange="updatePhotoBtn()">
        </div>
      </div>
    </div>

    <button type="button" class="btn-save" id="saveBtn" onclick="submitData()">डाटा सेभ गर्नुहोस्</button>
    <div style="height: 20px;"></div>
  </form>
</div>

<div id="managerModal" class="modal">
  <div class="modal-box">
    <h3 id="mTitle" style="color:var(--accent); margin-bottom: 15px; text-align: center;">सेटिङ</h3>
    <div class="row">
      <input type="text" id="newItemInp" placeholder="...">
      <button onclick="addItem()" style="width:50px; background:var(--accent); border:none; border-radius:10px; color:white;"><i class="fas fa-plus"></i></button>
    </div>
    <div id="itemList" style="max-height: 200px; overflow-y: auto; margin: 10px 0;"></div>
    <button onclick="closeModal('managerModal')" style="width:100%; padding:10px; background:rgba(255,255,255,0.05); color:white; border-radius:10px;">बन्द</button>
  </div>
</div>

<div id="dateTweakModal" class="modal">
  <div class="modal-box">
    <h3 style="color:var(--accent); text-align: center;">गते मिलाउनुस्</h3>
    <div style="display:flex; justify-content:center; align-items:center; gap:25px; margin:20px 0;">
      <button onclick="tweak(-1)" style="font-size:30px; background:none; border:none; color:var(--danger);"><i class="fas fa-minus-circle"></i></button>
      <span id="offD" style="font-size:35px; font-weight:800; color:white;">०</span>
      <button onclick="tweak(1)" style="font-size:30px; background:none; border:none; color:var(--success);"><i class="fas fa-plus-circle"></i></button>
    </div>
    <button onclick="closeModal('dateTweakModal')" style="width:100%; padding:10px; background:var(--danger); color:white; border-radius:10px;">बन्द</button>
  </div>
</div>

<script>
/* logic remains exactly as your original for reliability */
let offset = parseInt(localStorage.getItem('off')) || 0;
let currentKey = "";
const nepDigits = ['०','१','२','३','४','५','६','७','८','९'];
function toNep(n) { return n !== undefined ? n.toString().replace(/\d/g, d => nepDigits[d]) : "०"; }

function toggleMenu() { 
    const m = document.getElementById('menuOverlay');
    m.style.display = m.style.display === 'block' ? 'none' : 'block';
}

function openManager(key, title) { 
    toggleMenu(); 
    currentKey = key; 
    document.getElementById('mTitle').innerText = title; 
    renderList(); 
    document.getElementById('managerModal').style.display = 'flex'; 
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function openDateTweak() { toggleMenu(); document.getElementById('offD').innerText = toNep(offset); document.getElementById('dateTweakModal').style.display = 'flex'; }
function tweak(v) { offset += v; localStorage.setItem('off', offset); document.getElementById('offD').innerText = toNep(offset); calcNepaliDate(); }

function renderList() {
    let items = JSON.parse(localStorage.getItem(currentKey)) || [];
    document.getElementById('itemList').innerHTML = items.map((it, i) => `
    <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid rgba(255,255,255,0.05);">
      <span>${it}</span><span onclick="removeItem(${i})" style="color:var(--danger);"><i class="fas fa-trash"></i></span>
    </div>`).join('') || "खाली छ";
}

function addItem() {
    let v = document.getElementById('newItemInp').value.trim();
    if(!v) return;
    google.script.run.withSuccessHandler(() => {
        let items = JSON.parse(localStorage.getItem(currentKey)) || [];
        items.push(v);
        localStorage.setItem(currentKey, JSON.stringify(items));
        document.getElementById('newItemInp').value = "";
        renderList();
        updateDropdowns();
    }).saveSettingToSheet(currentKey, v);
}

function removeItem(i) {
    let items = JSON.parse(localStorage.getItem(currentKey)) || [];
    let val = items[i];
    google.script.run.removeSettingFromSheet(currentKey, val);
    items.splice(i, 1);
    localStorage.setItem(currentKey, JSON.stringify(items));
    renderList();
    updateDropdowns();
}

function updateDropdowns() {
    ['busNumber', 'driverName', 'instName'].forEach(id => {
        let items = JSON.parse(localStorage.getItem(id)) || [];
        let selectEl = document.getElementById(id);
        let html = id === 'busNumber' ? '<option value="">छान्नुहोस्</option>' : '<option value="">--छान्नुहोस्--</option>';
        selectEl.innerHTML = html + items.map(it => `<option value="${it}">${it}</option>`).join('');
    });
}

function fuelCalc(type) {
    let lit = parseFloat(document.getElementById('dLiter').value) || 0;
    let rat = parseFloat(document.getElementById('dRate').value) || 0;
    let amt = parseFloat(document.getElementById('dAmount').value) || 0;
    if (type === 'LIT' || type === 'RAT') {
        if (lit > 0 && rat > 0) document.getElementById('dAmount').value = Math.round(lit * rat);
    } else if (type === 'AMT') {
        if (amt > 0 && rat > 0) document.getElementById('dLiter').value = (amt / rat).toFixed(2);
    }
    resCalc();
}

function resCalc() {
    let t = parseFloat(document.getElementById('totalRes').value) || 0;
    let d = parseFloat(document.getElementById('dAmount').value) || 0;
    let e = parseFloat(document.getElementById('exp').value) || 0;
    document.getElementById('balance').value = Math.round(t - (d + e));
}

function calcRunKM() {
    let old = parseFloat(document.getElementById('lastKM').value) || 0;
    let curr = parseFloat(document.getElementById('currentKM').value) || 0;
    let diff = curr > old ? Math.round(curr - old) : 0;
    document.getElementById('runKMDisp').innerText = toNep(diff);
}

function fetchLastKM(bus) {
    if(!bus) { document.getElementById('oldKMDisp').innerText = "०"; document.getElementById('lastKM').value = 0; return; }
    document.getElementById('oldKMDisp').innerHTML = '...';
    google.script.run.withSuccessHandler(km => {
        document.getElementById('lastKM').value = km;
        document.getElementById('oldKMDisp').innerText = toNep(km);
        calcRunKM();
    }).getLastKM(bus, window.nepMonthName);
}

function calcNepaliDate() {
    let d = new Date(document.getElementById('engDate').value || new Date());
    let anchorEng = new Date("2026-04-14"); 
    let totalDays = Math.floor((d - anchorEng) / 86400000) + offset;
    let year = 2083; let month = 1; let day = totalDays + 1;
    if (day > 31) { month = 2; day = day - 31; }
    window.nepMonthName = ["बैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कात्तिक", "मंसिर", "पुष", "माघ", "फागुन", "चैत"][month-1];
    window.nepDateRaw = year + "/" + (month < 10 ? '0'+month : month) + "/" + (day < 10 ? '0'+day : day);
    const days = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
    window.nepDay = days[d.getDay()];
    document.getElementById('bsDisplay').innerText = toNep(year) + " " + window.nepMonthName + " " + toNep(day < 10 ? '0'+day : day) + " " + window.nepDay;
}

function setEntryType(t) {
    document.getElementById('entryType').value = t;
    document.getElementById('tabInst').className = t==='Institution'?'tab active':'tab';
    document.getElementById('tabRes').className = t==='Reserve'?'tab active':'tab';
    document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
    document.getElementById('resSection').style.display = t==='Reserve'?'block':'none';
    document.getElementById('reserveCalc').style.display = t==='Reserve'?'block':'none';
}

function updatePhotoBtn() {
    const file = document.getElementById('photoFile').files[0];
    if(file) document.getElementById('photoBtn').classList.add('selected');
}

function submitData() {
    const btn = document.getElementById('saveBtn');
    if(!document.getElementById('busNumber').value) { 
        Swal.fire({ icon: 'error', title: 'बस नम्बर?', background: '#1e293b', color: '#fff' }); 
        return; 
    }
    btn.disabled = true;
    btn.innerHTML = 'सेभ हुँदैछ...';
    
    const data = Object.fromEntries(new FormData(document.getElementById('busForm')).entries());
    const shift = document.querySelector('input[name="shift"]:checked').value;
    data.shiftColor = (shift === 'Morning') ? '#ef4444' : (shift === 'Afternoon' ? '#eab308' : '#22c55e');
    data.nepDateRaw = window.nepDateRaw;
    data.nepDay = window.nepDay;
    data.nepMonthName = window.nepMonthName;
    
    const file = document.getElementById('photoFile').files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            google.script.run.withSuccessHandler(done).process(data, { 
                base64: e.target.result.split(',')[1], 
                mimeType: file.type, 
                fileName: file.name 
            });
        };
        reader.readAsDataURL(file);
    } else {
        google.script.run.withSuccessHandler(done).process(data, null);
    }
}

function done(res) {
    if(res === "SUCCESS") {
        Swal.fire({ title: 'सफल!', icon: 'success', background: '#1e293b', color: '#fff', timer: 2000 });
        document.getElementById('busForm').reset();
        calcNepaliDate(); 
    }
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').innerHTML = 'डाटा सेभ गर्नुहोस्';
}

window.onload = () => {
    document.getElementById('engDate').value = new Date().toISOString().split('T')[0];
    calcNepaliDate(); 
    google.script.run.withSuccessHandler(settings => {
        if(settings) {
            localStorage.setItem('busNumber', JSON.stringify(settings.busNumber || []));
            localStorage.setItem('driverName', JSON.stringify(settings.driverName || []));
            localStorage.setItem('instName', JSON.stringify(settings.instName || []));
            updateDropdowns();
        }
    }).getSettings();
};
</script>
</body>
</html>
