<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap');
    :root { 
      --bg: #0f172a; 
      --accent: #6366f1; 
      --panel: #1e293b; 
      --text: #f8fafc; 
      --blue: #38bdf8;
      --card-bg: #1e293b;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Mukta', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 20px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: linear-gradient(90deg, #1e293b 0%, #334155 100%); border-bottom: 3px solid var(--accent); position:sticky; top:0; z-index:100; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .header-left { display: flex; align-items: center; gap: 10px; }
    
    .shift-container { display: flex; flex-direction: column; align-items: center; }
    .shift-text { font-size: 10px; font-weight: bold; margin-bottom: 2px; }
    .shift-group { display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 25px; }
    
    .shift-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .shift-btn { display: none; }
    .shift-label { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.3s; position: relative; }
    
    /* Radio Colors */
    #sMorning + .shift-label { background: var(--danger); opacity: 0.4; } 
    #sAfternoon + .shift-label { background: var(--warning); opacity: 0.4; } 
    #sBoth + .shift-label { background: var(--success); opacity: 0.4; } 
    
    #sMorning:checked + .shift-label { opacity: 1; border-color: #fff; transform: scale(1.2); box-shadow: 0 0 10px var(--danger); }
    #sAfternoon:checked + .shift-label { opacity: 1; border-color: #fff; transform: scale(1.2); box-shadow: 0 0 10px var(--warning); }
    #sBoth:checked + .shift-label { opacity: 1; border-color: #fff; transform: scale(1.2); box-shadow: 0 0 10px var(--success); }

    .container { padding: 12px; max-width: 500px; margin: auto; }
    .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 12px; text-align: center; background: #334155; border-radius: 12px; cursor: pointer; color: #94a3b8; font-weight: bold; transition: 0.3s; }
    .tab.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
    
    .card { background: var(--card-bg); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .col { flex: 1; }
    
    label { display: block; font-size: 12px; color: var(--blue); margin-bottom: 5px; text-align: center; font-weight: bold; }
    input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 15px; transition: 0.3s; }
    input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    
    .date-box { text-align: center; padding: 15px; background: linear-gradient(135deg, rgba(99,102,241,0.1) 0%, rgba(56,189,248,0.1) 100%); border: 2px solid var(--accent); border-radius: 15px; margin-bottom: 15px; }
    
    .btn-save { width: 100%; padding: 16px; background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%); border: none; border-radius: 15px; font-weight: 800; font-size: 18px; cursor: pointer; color:white; transition: 0.3s; margin-top: 10px; }
    .btn-save:active { transform: scale(0.98); }

    #menuOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; }
    .menu-content { position:absolute; right:15px; top:75px; background:var(--panel); width:240px; border-radius:15px; border:2px solid var(--accent); overflow: hidden; }
    .menu-item { padding:15px; border-bottom:1px solid #334155; cursor:pointer; color: white; display: flex; gap: 12px; align-items: center; transition: 0.2s; }
    .menu-item:hover { background: rgba(99,102,241,0.1); }
    
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; padding:20px; }
    .modal-box { background:var(--panel); padding:25px; border-radius:20px; width:100%; max-width:400px; border:2px solid var(--accent); text-align: center; }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="header-left">
    <h2 style="color:var(--accent); font-size: 20px; margin:0; letter-spacing: 1px;">🚍 बस सेवा</h2>
    <div class="shift-group">
      <div class="shift-item">
        <span class="shift-text" style="color:var(--danger)">बिहान</span>
        <input type="radio" name="shift" id="sMorning" value="Morning" class="shift-btn">
        <label for="sMorning" class="shift-label"></label>
      </div>
      <div class="shift-item">
        <span class="shift-text" style="color:var(--warning)">दिउँसो</span>
        <input type="radio" name="shift" id="sAfternoon" value="Afternoon" class="shift-btn">
        <label for="sAfternoon" class="shift-label"></label>
      </div>
      <div class="shift-item">
        <span class="shift-text" style="color:var(--success)">दुवै</span>
        <input type="radio" name="shift" id="sBoth" value="Both" class="shift-btn" checked>
        <label for="sBoth" class="shift-label"></label>
      </div>
    </div>
  </div>
  <div onclick="toggleMenu()" style="cursor:pointer; font-size: 24px; color:var(--accent);"><i class="fas fa-bars"></i></div>
</div>

<div id="menuOverlay" onclick="toggleMenu()">
  <div class="menu-content" onclick="event.stopPropagation()">
    <div class="menu-item" onclick="openManager('busNumber', 'बस सेटिङ')"><i class="fas fa-bus text-blue-400"></i> बस सेटिङ</div>
    <div class="menu-item" onclick="openManager('driverName', 'ड्राइभर सेटिङ')"><i class="fas fa-user-tie"></i> ड्राइभर सेटिङ</div>
    <div class="menu-item" onclick="openManager('instName', 'संस्था सेटिङ')"><i class="fas fa-university"></i> संस्था सेटिङ</div>
    <div class="menu-item" onclick="openDateTweak()"><i class="fas fa-calendar-check"></i> गते मिलाउनुस्</div>
  </div>
</div>

<div id="managerModal" class="modal">
  <div class="modal-box">
    <h3 id="mTitle" style="color:var(--accent); margin-bottom: 15px;">सेटिङ</h3>
    <div class="row">
      <input type="text" id="newItemInp" placeholder="नयाँ थप्नुहोस्...">
      <button onclick="addItem()" style="width:60px; background:var(--accent); border:none; border-radius:10px; color:white;"><i class="fas fa-plus"></i></button>
    </div>
    <div id="itemList" style="max-height: 250px; overflow-y: auto; margin: 15px 0; border: 1px solid #334155; border-radius: 10px;"></div>
    <button onclick="closeModal('managerModal')" style="width:100%; padding:12px; background:var(--danger); color:white; border:none; border-radius:10px; font-weight:bold;">बन्द</button>
  </div>
</div>

<div id="dateTweakModal" class="modal">
  <div class="modal-box">
    <h3 style="color:var(--accent)">गते मिलाउनुस्</h3>
    <div style="display:flex; justify-content:center; align-items:center; gap:30px; margin:25px 0;">
      <button onclick="tweak(-1)" style="font-size:40px; background:none; border:none; color:var(--danger);"><i class="fas fa-minus-circle"></i></button>
      <span id="offD" style="font-size:40px; font-weight:bold; color:var(--accent);">०</span>
      <button onclick="tweak(1)" style="font-size:40px; background:none; border:none; color:var(--success);"><i class="fas fa-plus-circle"></i></button>
    </div>
    <button onclick="closeModal('dateTweakModal')" style="width:100%; padding:12px; background:var(--danger); color:white; border:none; border-radius:10px;">बन्द</button>
  </div>
</div>

<div class="container">
  <div class="tab-container">
    <div id="tabInst" class="tab active" onclick="setEntryType('Institution')">🏫 संस्था</div>
    <div id="tabRes" class="tab" onclick="setEntryType('Reserve')">🚐 रिजर्भ</div>
  </div>

  <div class="date-box">
    <div id="bsDisplay" style="font-size: 22px; font-weight: bold; color: var(--accent);">...</div>
    <div id="adDisplay" style="font-size: 14px; color: #94a3b8; margin-top: 5px;">...</div>
  </div>

  <form id="busForm">
    <input type="hidden" id="entryType" name="entryType" value="Institution">
    <input type="hidden" id="lastKM" name="lastKM" value="0">
    
    <div class="card">
      <div class="row">
        <div class="col"><label>मिति (AD)</label><input type="date" id="engDate" name="engDate" onchange="calcNepaliDate()"></div>
        <div class="col" id="instCol"><label>संस्थाको नाम</label><select id="instName" name="instName"></select></div>
      </div>
      <div id="resSection" style="display:none;">
        <div class="row">
          <div class="col"><label>कहाँबाट</label><input type="text" name="routeFrom" placeholder="Source"></div>
          <div class="col"><label>कहाँसम्म</label><input type="text" name="routeTo" placeholder="Dest"></div>
        </div>
      </div>
      <div class="row">
        <div class="col"><label>ड्राइभर</label><select id="driverName" name="driverName"></select></div>
        <div class="col"><label>बस नम्बर</label><select id="busNumber" name="busNumber" onchange="fetchLastKM(this.value)"><option value="">Select</option></select></div>
      </div>
    </div>
    
    <div class="card" style="background: linear-gradient(180deg, #1e293b 0%, #161e2b 100%);">
      <div class="row">
        <div class="col"><label>लिटर</label><input type="number" id="dLiter" name="dLiter" oninput="fuelCalc('LIT')" step="any" inputmode="decimal"></div>
        <div class="col"><label>रेट</label><input type="number" id="dRate" name="dRate" oninput="fuelCalc('RAT')" step="any" inputmode="decimal"></div>
        <div class="col"><label>डिजल रकम</label><input type="number" id="dAmount" name="dAmount" oninput="fuelCalc('AMT')" step="any" inputmode="decimal" style="background: #020617; border-color: var(--accent);"></div>
      </div>
      <div class="row">
        <div class="col"><label>पुरानो KM</label><div id="oldKMDisp" style="padding:12px; background:#020617; border-radius:10px; text-align:center; color:var(--blue); font-weight:bold;">0</div></div>
        <div class="col"><label>आजको KM</label><input type="number" id="currentKM" name="currentKM" oninput="calcRunKM()" inputmode="decimal"></div>
        <div class="col"><label>चलेको KM</label><div id="runKMDisp" style="padding:12px; background:#020617; border-radius:10px; text-align:center; color:var(--success); font-weight:bold;">0</div></div>
      </div>
    </div>

    <div id="reserveCalc" class="card" style="display:none; background: rgba(244, 63, 94, 0.05); border-color: var(--danger);">
      <div class="row">
        <div class="col"><label>रिजर्भ रकम</label><input type="number" id="totalRes" name="totalReserveAmount" oninput="resCalc()" inputmode="decimal"></div>
        <div class="col"><label>बैना/खर्च</label><input type="number" id="exp" name="staffAllowance" oninput="resCalc()" inputmode="decimal"></div>
        <div class="col"><label>बचत</label><input type="number" id="balance" name="balance" readonly style="color:var(--success); font-weight:bold; background:#000;"></div>
      </div>
    </div>

    <div class="card">
      <div class="row" style="align-items: flex-end;">
        <div class="col" style="flex: 2.5;"><label>विवरण (कैफियत)</label><input type="text" name="remarks" placeholder="..."></div>
        <div class="col"><label>फोटो</label>
          <button type="button" id="photoBtn" onclick="document.getElementById('photoFile').click()" style="width:100%; padding:12px; background:var(--panel); border:2px dashed var(--accent); border-radius:10px; color:white;"><i class="fas fa-camera"></i></button>
          <input type="file" id="photoFile" accept="image/*" style="display:none;" onchange="updatePhotoBtn()">
        </div>
      </div>
    </div>

    <button type="button" class="btn-save" id="saveBtn" onclick="submitData()">डाटा सेभ गर्नुहोस्</button>
  </form>
</div>

<script>
let offset = parseInt(localStorage.getItem('off')) || 0;
let currentKey = "";
const nepDigits = ['०','१','२','३','४','५','६','७','८','९'];
function toNep(n) { return n ? n.toString().replace(/\d/g, d => nepDigits[d]) : "०"; }

function toggleMenu() { let m = document.getElementById('menuOverlay'); m.style.display = m.style.display==='block'?'none':'block'; }

function openManager(key, title) { 
  toggleMenu(); 
  currentKey = key; 
  document.getElementById('mTitle').innerText = title; 
  renderList(); 
  document.getElementById('managerModal').style.display = 'flex'; 
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function openDateTweak() { toggleMenu(); document.getElementById('offD').innerText = toNep(offset); document.getElementById('dateTweakModal').style.display = 'flex'; }
function tweak(v) { offset += v; localStorage.setItem('off', offset); document.getElementById('offD').innerText = toNep(offset); calcNepaliDate(); }

function renderList() {
  let items = JSON.parse(localStorage.getItem(currentKey)) || [];
  document.getElementById('itemList').innerHTML = items.map((it, i) => `
    <div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #334155; align-items:center;">
      <span style="font-weight:bold;">${it}</span><span onclick="removeItem(${i})" style="color:var(--danger); cursor:pointer; padding:5px;"><i class="fas fa-trash-alt"></i></span>
    </div>`).join('') || "<div style='padding:15px; color:#64748b;'>डाटा खाली छ</div>";
}

function addItem() {
  let v = document.getElementById('newItemInp').value.trim();
  if(!v) return;
  google.script.run.withSuccessHandler(() => {
    let items = JSON.parse(localStorage.getItem(currentKey)) || [];
    items.push(v);
    localStorage.setItem(currentKey, JSON.stringify(items));
    document.getElementById('newItemInp').value = "";
    renderList();
    updateDropdowns();
  }).saveSettingToSheet(currentKey, v);
}

function removeItem(i) {
  let items = JSON.parse(localStorage.getItem(currentKey)) || [];
  let val = items[i];
  google.script.run.removeSettingFromSheet(currentKey, val);
  items.splice(i, 1);
  localStorage.setItem(currentKey, JSON.stringify(items));
  renderList();
  updateDropdowns();
}

function updateDropdowns() {
  ['busNumber', 'driverName', 'instName'].forEach(id => {
    let items = JSON.parse(localStorage.getItem(id)) || [];
    let selectEl = document.getElementById(id);
    let html = id === 'busNumber' ? '<option value="">छान्नुहोस्</option>' : '<option value="">--छान्नुहोस्--</option>';
    selectEl.innerHTML = html + items.map(it => `<option value="${it}">${it}</option>`).join('');
  });
}

function fuelCalc(type) {
  let lit = parseFloat(document.getElementById('dLiter').value) || 0;
  let rat = parseFloat(document.getElementById('dRate').value) || 0;
  let amt = parseFloat(document.getElementById('dAmount').value) || 0;
  if (type === 'LIT' || type === 'RAT') {
    if (lit > 0 && rat > 0) document.getElementById('dAmount').value = Math.round(lit * rat);
  } else if (type === 'AMT') {
    if (amt > 0 && rat > 0) document.getElementById('dLiter').value = (amt / rat).toFixed(2);
  }
  resCalc();
}

function resCalc() {
  let t = parseFloat(document.getElementById('totalRes').value) || 0;
  let d = parseFloat(document.getElementById('dAmount').value) || 0;
  let e = parseFloat(document.getElementById('exp').value) || 0;
  document.getElementById('balance').value = Math.round(t - (d + e));
}

function calcRunKM() {
  let old = parseFloat(document.getElementById('lastKM').value) || 0;
  let curr = parseFloat(document.getElementById('currentKM').value) || 0;
  let diff = curr > old ? Math.round(curr - old) : 0;
  document.getElementById('runKMDisp').innerText = toNep(diff);
}

function fetchLastKM(bus) {
  if(!bus) { document.getElementById('oldKMDisp').innerText = "०"; document.getElementById('lastKM').value = 0; return; }
  document.getElementById('oldKMDisp').innerText = "⌛";
  google.script.run.withSuccessHandler(km => {
    document.getElementById('lastKM').value = km;
    document.getElementById('oldKMDisp').innerText = toNep(km);
    calcRunKM();
  }).getLastKM(bus, window.nepMonthName);
}

function calcNepaliDate() {
  let d = new Date(document.getElementById('engDate').value || new Date());
  let anchorEng = new Date("2026-04-14"); 
  let totalDays = Math.floor((d - anchorEng) / 86400000) + offset;
  let year = 2083; let month = 1; let day = totalDays + 1;
  if (day > 31) { month = 2; day = day - 31; }
  window.nepMonthName = ["बैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कात्तिक", "मंसिर", "पुष", "माघ", "फागुन", "चैत"][month-1];
  window.nepDateRaw = year + "/" + (month < 10 ? '0'+month : month) + "/" + (day < 10 ? '0'+day : day);
  const days = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  window.nepDay = days[d.getDay()];
  document.getElementById('bsDisplay').innerText = toNep(year) + " " + window.nepMonthName + " " + toNep(day < 10 ? '0'+day : day) + " " + window.nepDay;
  document.getElementById('adDisplay').innerText = d.toDateString();
}

function setEntryType(t) {
  document.getElementById('entryType').value = t;
  document.getElementById('tabInst').className = t==='Institution'?'tab active':'tab';
  document.getElementById('tabRes').className = t==='Reserve'?'tab active':'tab';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resSection').style.display = t==='Reserve'?'block':'none';
  document.getElementById('reserveCalc').style.display = t==='Reserve'?'block':'none';
}

function updatePhotoBtn() {
  const file = document.getElementById('photoFile').files[0];
  if(file) {
    document.getElementById('photoBtn').style.background = "var(--success)";
    document.getElementById('photoBtn').innerHTML = '<i class="fas fa-check"></i> Photo Selected';
  }
}

function submitData() {
  const btn = document.getElementById('saveBtn');
  if(!document.getElementById('busNumber').value) { Swal.fire("Error", "कृपया बस नम्बर छान्नुहोस्", "error"); return; }
  
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> सेभ हुँदैछ...';
  
  const data = Object.fromEntries(new FormData(document.getElementById('busForm')).entries());
  const shift = document.querySelector('input[name="shift"]:checked').value;
  data.shiftColor = (shift === 'Morning') ? '#ef4444' : (shift === 'Afternoon' ? '#eab308' : '#22c55e');

  data.nepDateRaw = window.nepDateRaw;
  data.nepDay = window.nepDay;
  data.nepMonthName = window.nepMonthName;
  
  const file = document.getElementById('photoFile').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      google.script.run.withSuccessHandler(done).process(data, { 
        base64: e.target.result.split(',')[1], 
        mimeType: file.type, 
        fileName: file.name 
      });
    };
    reader.readAsDataURL(file);
  } else {
    google.script.run.withSuccessHandler(done).process(data, null);
  }
}

function done(res) {
  if(res === "SUCCESS") {
    Swal.fire({ title: 'सफल भयो!', text: 'डाटा सुरक्षित गरियो!', icon: 'success', timer: 1500, showConfirmButton: false });
    const lastDate = document.getElementById('engDate').value;
    document.getElementById('busForm').reset();
    document.getElementById('engDate').value = lastDate;
    document.getElementById('oldKMDisp').innerText = "०";
    document.getElementById('runKMDisp').innerText = "०";
    document.getElementById('photoBtn').style.background = "var(--panel)";
    document.getElementById('photoBtn').innerHTML = '<i class="fas fa-camera"></i>';
    calcNepaliDate(); 
  } else { Swal.fire("चेतावनी", res, "warning"); }
  document.getElementById('saveBtn').disabled = false;
  document.getElementById('saveBtn').innerText = "डाटा सेभ गर्नुहोस्";
}

window.onload = () => {
  document.getElementById('engDate').value = new Date().toISOString().split('T')[0];
  calcNepaliDate(); 
  google.script.run.withSuccessHandler(settings => {
    if(settings) {
      localStorage.setItem('busNumber', JSON.stringify(settings.busNumber || []));
      localStorage.setItem('driverName', JSON.stringify(settings.driverName || []));
      localStorage.setItem('instName', JSON.stringify(settings.instName || []));
      updateDropdowns();
    }
  }).getSettings();
};
</script>
</body>
</html>
