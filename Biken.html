<!DOCTYPE html>
<html lang="ne">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Mukta:wght@600;800&display=swap');
    :root { --bg: #0f172a; --card: #1e293b; --blue: #38bdf8; --green: #4ade80; --red: #fb7185; --text: #f1f5f9; --border: #334155; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Mukta', sans-serif; text-align:center; }
    body { background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
    
    .header { padding:10px; background:var(--card); border-bottom:2px solid var(--blue); display:flex; justify-content:space-between; align-items:center; z-index:1000; position:relative; }
    #bsDisplay { font-size:16px; font-weight:800; color:var(--green); text-align:left; flex:1; }
    
    .shift-box { display:flex; gap:4px; background:#0f172a; padding:4px; border-radius:8px; border:1px solid var(--border); }
    .shift-box input { display:none; }
    .shift-box label { padding:4px 10px; font-size:12px; cursor:pointer; border-radius:5px; color:#64748b; font-weight:800; }
    #sMorning:checked + label { background:var(--red); color:white; }
    #sAfternoon:checked + label { background: #fb923c; color:white; }
    #sBoth:checked + label { background:var(--green); color:black; }

    .container { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; padding-bottom:70px; }
    
    .setting-bar { display:flex; justify-content:space-around; background:var(--card); padding:10px; border-radius:15px; border:1px solid var(--blue); margin-bottom:5px; }
    .set-btn { background:none; border:none; color:var(--blue); font-size:22px; cursor:pointer; flex:1; }
    .set-btn span { display:block; font-size:11px; color:#94a3b8; margin-top:2px; font-weight:800; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:15px; padding:15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .label { font-size:11px; color:var(--blue); font-weight:800; margin-bottom:4px; text-transform:uppercase; text-align:left; padding-left:2px; }
    input, select, .km-box { width:100%; height:45px; border-radius:10px; background:#0f172a; border:1.5px solid var(--border); color:white; font-size:16px; font-weight:700; outline:none; }
    .km-box { border:2px solid var(--green); color:var(--green); font-family:'Orbitron'; display:flex; align-items:center; justify-content:center; }
    
    .row { display:flex; gap:8px; margin-bottom:10px; width:100%; }
    .col { flex:1; min-width:0; }

    .tab-btn { flex:1; padding:12px; border-radius:10px; border:1.5px solid var(--blue); background:rgba(56,189,248,0.1); color:var(--blue); font-weight:800; cursor:pointer; }
    .tab-btn.active { background:var(--blue); color:black; }

    #photoBtn { width:100%; height:45px; background:rgba(56,189,248,0.1); border:1.5px solid var(--blue); color:var(--blue); border-radius:10px; cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    #photoBtn img { height:100%; width:100%; object-fit:cover; }

    .btn-save { background:linear-gradient(135deg, var(--blue), var(--green)); border:none; padding:18px; border-radius:15px; color:black; font-size:20px; font-weight:900; width:100%; cursor:pointer; margin-top:10px; box-shadow: 0 0 15px rgba(74,222,128,0.4); }

    .date-pop { display:none; position:fixed; top:120px; left:50%; transform:translateX(-50%); background:var(--card); border:2px solid var(--blue); padding:20px; border-radius:15px; z-index:9999; width:280px; box-shadow:0 0 100px #000; }
    .off-btn { background:#334155; border:1px solid var(--blue); color:white; padding:12px; border-radius:8px; cursor:pointer; font-weight:900; flex:1; }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000; align-items:center; justify-content:center; }
  </style>
</head>
<body>

<div class="header">
  <div id="bsDisplay">लोड हुँदैछ...</div>
  <div class="shift-box">
    <input type="radio" name="shift" id="sMorning" value="बिहान" onchange="updateShift('#fb7185')">
    <label for="sMorning">बिहान</label>
    <input type="radio" name="shift" id="sAfternoon" value="दिउँसो" onchange="updateShift('#fb923c')">
    <label for="sAfternoon">दिउँसो</label>
    <input type="radio" name="shift" id="sBoth" value="दुवै" checked onchange="updateShift('#4ade80')">
    <label for="sBoth">दुवै</label>
  </div>
</div>

<div class="container">
  <div class="setting-bar">
    <button type="button" class="set-btn" onclick="openMgr('busNumber', 'बस सेटिङ')"><i class="fas fa-bus"></i><span>बस</span></button>
    <button type="button" class="set-btn" onclick="openMgr('driverName', 'ड्राइभर')"><i class="fas fa-user-tie"></i><span>ड्राइभर</span></button>
    <button type="button" class="set-btn" onclick="openMgr('instName', 'संस्था')"><i class="fas fa-university"></i><span>संस्था</span></button>
    <button type="button" class="set-btn" onclick="toggleDate()" style="color:#fb923c"><i class="fas fa-calendar-alt"></i><span>मिति</span></button>
  </div>

  <div id="datePop" class="date-pop">
    <div style="margin-bottom:15px; font-weight:800; color:var(--blue)">गते मात्र मिलाउनुहोस्</div>
    <div style="display:flex; gap:10px;">
      <button type="button" class="off-btn" onclick="changeD(-1)">- १ गते</button>
      <button type="button" class="off-btn" onclick="changeD(1)">+ १ गते</button>
    </div>
    <div style="margin-top:15px;">
      <div class="label" style="text-align:center">AD क्यालेन्डर बाट छान्नुहोस्</div>
      <input type="date" id="engDate" onchange="manualOffset=0; calcDate();">
    </div>
    <button type="button" onclick="toggleDate()" style="width:100%; margin-top:15px; padding:8px; border-radius:8px; background:var(--red); border:none; color:white; font-weight:800;">बन्द</button>
  </div>

  <div class="row">
    <button type="button" id="tInst" class="tab-btn active" onclick="setType('Institution')">संस्था</button>
    <button type="button" id="tRes" class="tab-btn" onclick="setType('Reserve')">रिजर्भ</button>
  </div>

  <form id="mainForm">
    <input type="hidden" id="entryType" name="entryType" value="Institution">
    <input type="hidden" id="lastKM" name="lastKM" value="0">
    <input type="hidden" id="shiftColor" name="shiftColor" value="#4ade80">

    <div class="card">
      <div class="row">
        <div class="col"><div class="label">बस नम्बर</div><select id="busNumber" name="busNumber" onchange="getKM(this.value)"></select></div>
        <div class="col"><div class="label">ड्राइभर</div><select id="driverName" name="driverName"></select></div>
        <div class="col" id="instCol"><div class="label">संस्था</div><select id="instName" name="instName"></select></div>
      </div>

      <div id="resSection" style="display:none" class="row">
        <div class="col"><div class="label">कहाँबाट</div><input type="text" name="routeFrom"></div>
        <div class="col"><div class="label">कहाँसम्म</div><input type="text" name="routeTo"></div>
      </div>

      <div class="row">
        <div class="col"><div class="label">डिजल लिटर</div><input type="number" id="dLit" name="dLiter" oninput="fc('L')" step="any" inputmode="decimal"></div>
        <div class="col"><div class="label">रेट</div><input type="number" id="dRat" name="dRate" oninput="fc('R')" step="any" inputmode="decimal"></div>
        <div class="col"><div class="label">रकम</div><input type="number" id="dAmt" name="dAmount" oninput="fc('A')" step="any" inputmode="decimal"></div>
      </div>

      <div class="row">
        <div class="col"><div class="label">पुरानो KM</div><div id="oKM" class="km-box">०</div></div>
        <div class="col"><div class="label">आजको KM</div><input type="number" id="cKM" name="currentKM" oninput="ckm()" inputmode="decimal"></div>
        <div class="col"><div class="label">चलेको</div><div id="rKM" class="km-box" style="color:var(--blue); border-color:var(--blue)">०</div></div>
      </div>

      <div id="resCalc" style="display:none; border-top:1px solid var(--border); padding-top:10px;">
        <div class="row">
          <div class="col"><div class="label">भाडा</div><input type="number" id="tResInp" name="totalReserveAmount" oninput="rc()" inputmode="decimal"></div>
          <div class="col"><div class="label">खर्च</div><input type="number" id="exp" name="staffAllowance" oninput="rc()" inputmode="decimal"></div>
          <div class="col"><div class="label">बचत</div><input type="number" id="bal" name="balance" readonly style="color:var(--green)"></div>
        </div>
      </div>

      <div class="row" style="margin-top:5px;">
        <div class="col" style="flex:3"><div class="label">कैफियत</div><input type="text" name="remarks" placeholder="..."></div>
        <div class="col" style="flex:1">
           <div class="label">फोटो</div>
           <div id="photoBtn" onclick="document.getElementById('pFile').click()"><i class="fas fa-camera"></i></div>
           <input type="file" id="pFile" accept="image/*" style="display:none" onchange="pv(this)">
        </div>
      </div>
    </div>
    <button type="button" class="btn-save" id="saveBtn" onclick="send()">डाटा सुरक्षित गर्नुहोस्</button>
  </form>
</div>

<div id="mgrModal" class="modal">
  <div style="background:var(--card); padding:20px; border-radius:15px; border:2px solid var(--blue); width:90%; max-width:320px;">
    <h3 id="mTitle" style="color:var(--blue); margin-bottom:15px;"></h3>
    <div class="row"><input type="text" id="mInp" style="flex:1"><button onclick="addM()" style="background:var(--green); border:none; padding:0 15px; border-radius:8px; font-weight:900;">ADD</button></div>
    <div id="mList" style="max-height:200px; overflow-y:auto; margin:10px 0; text-align:left;"></div>
    <button onclick="closeMgr()" style="width:100%; padding:10px; background:var(--red); border:none; color:white; border-radius:10px; font-weight:800;">बन्द</button>
  </div>
</div>

<script>
let manualOffset = 0; 
const nD = ['०','१','२','३','४','५','६','७','८','९'];
const toN = n => n.toString().replace(/\d/g, d => nD[d]);

function toggleDate() { 
  const p = document.getElementById('datePop'); 
  p.style.display = p.style.display === 'block' ? 'none' : 'block'; 
}

function changeD(v) { 
  manualOffset += v; 
  calcDate(); 
}

function calcDate() {
  const realEngDate = new Date(document.getElementById('engDate').value || new Date());
  let calcD = new Date(realEngDate);
  calcD.setDate(calcD.getDate() + manualOffset);
  const anchor = new Date("2026-04-14");
  let diff = Math.floor((calcD - anchor) / 86400000);
  let y = 2083, m = 1, day = diff + 1;
  const mDays = [31, 31, 31, 32, 31, 30, 30, 30, 29, 30, 29, 30];
  for(let i=0; i<12; i++) {
    if(day > mDays[i]) { day -= mDays[i]; m++; } else break;
  }
  const mNames = ["वैशाख","जेठ","असार","साउन","भदौ","असोज","कात्तिक","मंसिर","पुष","माघ","फागुन","चैत"];
  const days = ["आइतबार","सोमबार","मंगलबार","बुधबार","बिहीबार","शुक्रबार","शनिबार"];
  window.nepMonthName = mNames[m-1];
  window.nepDay = days[realEngDate.getDay()];
  window.nepDateRaw = y + "/" + (m<10?'0'+m:m) + "/" + (day<10?'0'+day:day);
  window.engDateFormatted = realEngDate.toISOString().split('T')[0];
  document.getElementById('bsDisplay').innerText = toN(y) + " " + window.nepMonthName + " " + toN(day<10?'0'+day:day) + " " + window.nepDay;
}

function pv(input) {
  if (input.files && input.files[0]) {
    const r = new FileReader();
    r.onload = e => document.getElementById('photoBtn').innerHTML = `<img src="${e.target.result}">`;
    r.readAsDataURL(input.files[0]);
  }
}

function fc(t) {
  let l = parseFloat(document.getElementById('dLit').value)||0;
  let r = parseFloat(document.getElementById('dRat').value)||0;
  let a = parseFloat(document.getElementById('dAmt').value)||0;
  if(t==='L'||t==='R') { if(l&&r) document.getElementById('dAmt').value = Math.round(l*r); }
  else if(t==='A'&&r) document.getElementById('dLit').value = (a/r).toFixed(2);
  rc(); // डिजल रकम फेरिँदा बचत फेर्नुपर्छ
}

function rc() {
  let t = parseFloat(document.getElementById('tResInp').value)||0;
  let d = parseFloat(document.getElementById('dAmt').value)||0;
  let e = parseFloat(document.getElementById('exp').value)||0;
  // बचत = भाडा - डिजल - खर्च
  document.getElementById('bal').value = Math.round(t - (d + e));
}

function getKM(bus) {
  if(!bus) return;
  document.getElementById('oKM').innerText = "...";
  google.script.run.withSuccessHandler(km => {
    document.getElementById('lastKM').value = km;
    document.getElementById('oKM').innerText = toN(km);
    ckm();
  }).getLastKM(bus, window.nepMonthName);
}

function ckm() {
  let o = parseFloat(document.getElementById('lastKM').value)||0, c = parseFloat(document.getElementById('cKM').value)||0;
  document.getElementById('rKM').innerText = toN(c > o ? Math.round(c - o) : 0);
}

function setType(t) {
  document.getElementById('entryType').value = t;
  document.getElementById('tInst').className = t==='Institution'?'tab-btn active':'tab-btn';
  document.getElementById('tRes').className = t==='Reserve'?'tab-btn active':'tab-btn';
  document.getElementById('instCol').style.display = t==='Institution'?'block':'none';
  document.getElementById('resSection').style.display = t==='Reserve'?'flex':'none';
  document.getElementById('resCalc').style.display = t==='Reserve'?'block':'none';
}

function updateShift(c) { document.getElementById('shiftColor').value = c; }

let curK = "";
function openMgr(k, t) { curK = k; document.getElementById('mTitle').innerText = t; renderM(); document.getElementById('mgrModal').style.display = 'flex'; }
function closeMgr() { document.getElementById('mgrModal').style.display = 'none'; }
function renderM() {
  let items = JSON.parse(localStorage.getItem(curK)) || [];
  document.getElementById('mList').innerHTML = items.map((it, i) => `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #334155; color:white;"><span>${it}</span><i class="fas fa-trash" onclick="remM(${i})" style="color:var(--red); cursor:pointer"></i></div>`).join('');
}
function addM() {
  let v = document.getElementById('mInp').value; if(!v) return;
  google.script.run.withSuccessHandler(() => {
    let items = JSON.parse(localStorage.getItem(curK)) || []; items.push(v);
    localStorage.setItem(curK, JSON.stringify(items)); document.getElementById('mInp').value = ""; renderM(); upD();
  }).saveSettingToSheet(curK, v);
}
function remM(i) {
  let items = JSON.parse(localStorage.getItem(curK)) || [];
  google.script.run.removeSettingFromSheet(curK, items[i]);
  items.splice(i, 1); localStorage.setItem(curK, JSON.stringify(items)); renderM(); upD();
}
function upD() {
  ['busNumber', 'instName', 'driverName'].forEach(id => {
    let items = JSON.parse(localStorage.getItem(id)) || [];
    document.getElementById(id).innerHTML = '<option value="">छान्नुहोस्</option>' + items.map(x => `<option value="${x}">${x}</option>`).join('');
  });
}

function send() {
  const btn = document.getElementById('saveBtn');
  if(!document.getElementById('busNumber').value) return Swal.fire({ icon:'error', title:'बस छान्नुहोस्' });
  
  btn.disabled = true; btn.innerText = "सुरक्षित हुँदै...";
  const fD = new FormData(document.getElementById('mainForm'));
  const data = Object.fromEntries(fD.entries());
  
  data.nepDateRaw = window.nepDateRaw;
  data.nepDay = window.nepDay;
  data.nepMonthName = window.nepMonthName;
  data.engDate = window.engDateFormatted;
  data.lastKM = document.getElementById('lastKM').value;

  const file = document.getElementById('pFile').files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => { 
      google.script.run.withSuccessHandler(res => done(res, btn)).process(data, { base64: e.target.result.split(',')[1], mimeType: file.type, fileName: file.name });
    };
    reader.readAsDataURL(file);
  } else { google.script.run.withSuccessHandler(res => done(res, btn)).process(data, null); }
}

function done(r, b) {
  if (r === "SUCCESS") { 
    Swal.fire({ icon:'success', title:'डाटा सुरक्षित भयो' }); 
    document.getElementById('mainForm').reset(); 
    document.getElementById('photoBtn').innerHTML = '<i class="fas fa-camera"></i>';
    document.getElementById('oKM').innerText = "०"; document.getElementById('rKM').innerText = "०";
    calcDate(); 
  } else { Swal.fire({ icon:'error', title:r }); }
  b.disabled = false; b.innerText = "डाटा सुरक्षित गर्नुहोस्";
}

window.onload = () => {
  document.getElementById('engDate').value = new Date().toISOString().split('T')[0];
  calcDate();
  google.script.run.withSuccessHandler(s => {
    localStorage.setItem('busNumber', JSON.stringify(s.busNumber));
    localStorage.setItem('instName', JSON.stringify(s.instName));
    localStorage.setItem('driverName', JSON.stringify(s.driverName));
    upD();
  }).getSettings();
};
</script>
</body>
</html>
